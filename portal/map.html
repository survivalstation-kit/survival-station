<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline Map</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
</head>
<body class="map-page" data-page="map">
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Survival <span>Station</span></a>
  <nav class="links">
    <a href="index.html" data-i18n="nav.home">Home</a>
    <a href="chat.html" data-i18n="nav.chat">Ask AI</a>
    <a href="map.html" aria-current="page" data-i18n="nav.map">Map</a>
    <a href="cards.html" data-cards data-i18n="nav.cards">Emergency</a>
    <a href="search.html" data-i18n="nav.search">Search</a>
    <a href="help.html" data-i18n="nav.help">Help</a>
  </nav>
  <select class="lang-select" aria-label="Language / Idioma"></select>
  <button class="theme-btn" type="button" data-i18n="theme">Theme</button>
</div></header>

<div id="map"></div>
<div class="map-panel" id="panel"><span data-i18n="map.tap"></span></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="vendor/basemaps.js"></script>
<script>
(async () => {
  const { t } = SURVIVAL;
  const panel = document.getElementById('panel');
  const say = msg => { panel.replaceChildren(); panel.textContent = msg; panel.classList.add('warn'); };

  // PMTiles needs HTTP range requests, so the page has to come from the start program's server
  if (!SURVIVAL.served || typeof maplibregl === 'undefined') return say(t('map.needserver'));

  let maps = [];
  try { maps = await (await fetch('maps/index.json', { cache: 'no-store' })).json(); } catch {}
  if (!maps.length) return say(t('map.none'));

  const base = location.href.replace(/[^/]*([?#].*)?$/, '');
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  // world overview first, detailed regions drawn on top of it
  maps.sort((a, b) => (b.name === 'world') - (a.name === 'world'));
  const archives = maps.map(m => {
    const p = new pmtiles.PMTiles(base + 'maps/' + encodeURIComponent(m.file));
    protocol.add(p);
    return p;
  });
  const headers = await Promise.all(archives.map(a => a.getHeader().catch(() => null)));
  // A map whose file won't load (on Windows the AI server can't send files over 2 GB) comes as tiles
  // from the kit's map server instead, using the zooms and bounds the builder wrote in index.json
  const tileServer = `${location.protocol}//${location.hostname}:8092/`;
  const viaServer = maps.map((m, i) => !headers[i] && Array.isArray(m.bounds));
  const bounds = maps.map((m, i) => headers[i] ? [headers[i].minLon, headers[i].minLat, headers[i].maxLon, headers[i].maxLat]
    : viaServer[i] ? m.bounds : null);

  function style(dark) {
    const flavor = basemaps.namedFlavor(dark ? 'dark' : 'light');
    const sources = {}, layers = [];
    maps.forEach((m, i) => {
      const id = 'm' + i;
      sources[id] = viaServer[i]
        ? { type: 'vector', tiles: [tileServer + encodeURIComponent(m.name) + '/{z}/{x}/{y}.mvt'],
            minzoom: m.minzoom || 0, maxzoom: m.maxzoom || 15, bounds: m.bounds, attribution: '© OpenStreetMap' }
        : { type: 'vector', url: 'pmtiles://' + archives[i].source.getKey(), attribution: i ? '© OpenStreetMap' : '© OpenStreetMap · place search © GeoNames' };
      for (const l of basemaps.layers(id, flavor, { lang: SURVIVAL.dict._map })) {
        if (i > 0 && l.type === 'background') continue;   // keep the world map visible around a region
        layers.push({ ...l, id: `${id}-${l.id}` });
      }
    });
    return {
      version: 8, sources, layers,
      glyphs: base + 'vendor/basemaps-assets/fonts/{fontstack}/{range}.pbf',
      sprite: base + 'vendor/basemaps-assets/sprites/v4/' + (dark ? 'dark' : 'light'),
    };
  }

  // start on the most detailed region if there is one
  const region = bounds.findIndex((b, i) => b && maps[i].name !== 'world');
  const saved = (() => { try { return JSON.parse(SURVIVAL.store('map-view')); } catch { return null; } })();
  const box = b => [[b[0], b[1]], [b[2], b[3]]];

  const view = saved ? { center: saved.center, zoom: saved.zoom }
    : region >= 0 ? { bounds: box(bounds[region]) }
    : { center: [0, 20], zoom: 1.5 };
  const map = new maplibregl.Map({
    container: 'map',
    style: style(SURVIVAL.isDark()),
    ...view,
    maxZoom: 19,
    attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl(), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');
  // GPS only works on the computer itself (browsers block it on plain-http network addresses)
  if (window.isSecureContext) map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: true }), 'top-right');

  // top left: place search, and "Go to" each map on the kit (the page reopens where it was left)
  const ctl = document.createElement('div'); ctl.className = 'maplibregl-ctrl map-tools';
  const search = document.createElement('input');
  search.type = 'search'; search.className = 'map-search'; search.placeholder = t('map.search'); search.setAttribute('aria-label', t('map.search'));
  const found = document.createElement('ul'); found.className = 'map-found'; found.hidden = true;
  ctl.append(search, found);
  const areas = maps.map((m, i) => ({ m, b: bounds[i] })).filter(p => p.b);
  if (areas.length > 1) {
    const sel = document.createElement('select');
    sel.className = 'map-goto'; sel.setAttribute('aria-label', t('map.goto'));
    sel.add(new Option(t('map.goto'), ''));
    areas.forEach((p, i) => sel.add(new Option(p.m.name === 'world' ? t('map.world')
      : p.m.name.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()), i)));
    sel.onchange = () => { if (sel.value !== '') map.fitBounds(box(areas[sel.value].b), { padding: 20 }); sel.value = ''; };
    ctl.append(sel);
  }
  map.addControl({ onAdd() { return ctl; }, onRemove() {} }, 'top-left');
  ctl.addEventListener('mousedown', e => e.stopPropagation());   // typing and picking shouldn't pan the map

  // ---- place search: the builder's GeoNames lists in maps/places (Build-Places in setup\build-drive.ps1)
  const fold = s => s.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  const wordsOf = s => fold(s).split(/[^\p{L}\p{N}]+/u).filter(w => w.length >= 2);
  const shardKey = w => [...w.slice(0, 2)].map(c => /[a-z0-9]/.test(c) ? c : '_').join('');   // as in the builder
  const lists = {};
  const load = name => lists[name] = lists[name] || fetch(`maps/places/${name}.json`).then(r => r.ok ? r.json() : null).catch(() => null);
  // "hospital" or "aeroporto" alone (or "nearest hospital") lists the nearest of that type instead
  const TYPES = {
    hospital: ['hospital', 'hospitals', 'hospitais', 'clinic', 'clinics', 'clinica', 'clinicas', 'upa'],
    airport: ['airport', 'airports', 'aeroporto', 'aeroportos', 'airfield', 'heliport', 'heliporto'],
    fire: ['fire', 'bombeiros', 'bombeiro'], police: ['police', 'policia', 'delegacia'],
  };
  const NEAR = new Set(['near', 'nearest', 'closest', 'mais', 'proximo', 'proxima', 'perto', 'de', 'do', 'da', 'the', 'a', 'o']);
  const km = (lat1, lon1, lat2, lon2) => {
    const r = Math.PI / 180, a = Math.sin((lat2 - lat1) * r / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lon2 - lon1) * r / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(a));
  };
  const kindOf = p => {   // p = [name, lat, lon, code, state, country, population, other name]
    const c = p[3];
    if (c === 'PPLX') return t('map.kind.district');
    if (c.startsWith('PPL')) return t(p[6] >= 100000 || c === 'PPLC' || c === 'PPLA' ? 'map.kind.city' : 'map.kind.town');
    return t({ HSP: 'map.kind.hospital', HSPC: 'map.kind.clinic', HSPD: 'map.kind.clinic', AIRP: 'map.kind.airport', AIRF: 'map.kind.airfield',
      AIRH: 'map.kind.heliport', FIRE: 'map.kind.fire', PP: 'map.kind.police', MT: 'map.kind.mountain', PK: 'map.kind.mountain',
      LK: 'map.kind.lake', PRK: 'map.kind.park' }[c] || 'map.kind.place');
  };
  const zoomFor = p => p[3].startsWith('PPL') ? (p[3] === 'PPLX' ? 15 : p[6] >= 100000 ? 11 : 13) : ['LK', 'PRK', 'MT', 'PK'].includes(p[3]) ? 12 : 16;

  async function findPlaces(q) {
    const ws = wordsOf(q), c = map.getCenter();
    if (!ws.length) return [];
    const dist = p => km(c.lat, c.lng, p[1], p[2]);
    const type = Object.keys(TYPES).find(k => ws.some(w => TYPES[k].includes(w)) && ws.every(w => TYPES[k].includes(w) || NEAR.has(w)));
    if (type) {
      const all = await load('type-' + type);
      if (all === null) return null;
      return all.map(p => ({ p, d: dist(p) })).sort((a, b) => a.d - b.d).slice(0, 15);
    }
    // the lists for each word's first two letters (a very common word like "lake" has none of its own,
    // so "lake tahoe" is found through "tahoe"); every typed word must start a word of the name
    const got = await Promise.all([...new Set(ws.map(shardKey))].map(load));
    if (got.every(l => l === null)) return null;
    const seen = new Set(), hits = [];
    for (const l of got) for (const p of l || []) {
      const key = p[1] + ',' + p[2];
      if (seen.has(key)) continue;
      for (const name of [p[0], p[7]]) {
        if (!name) continue;
        const nw = wordsOf(name);
        if (!ws.every(w => nw.some(x => x.startsWith(w)))) continue;
        const exact = fold(name).trim() === fold(q).trim();
        const d = dist(p);
        // bigger and closer first; a name typed in full first of all
        hits.push({ p, d, score: (exact ? 10 : 0) + Math.log10(p[6] + 10) - Math.log10(d + 1) * 1.2 });
        seen.add(key);
        break;
      }
    }
    return hits.sort((a, b) => b.score - a.score).slice(0, 15);
  }

  function showFound(hits) {
    found.replaceChildren();
    if (hits === null) { const li = document.createElement('li'); li.className = 'muted'; li.textContent = t('map.search.missing'); found.append(li); }
    else if (!hits.length) { const li = document.createElement('li'); li.className = 'muted'; li.textContent = t('map.search.none'); found.append(li); }
    else for (const { p, d } of hits) {
      const li = document.createElement('li');
      const b = document.createElement('button'); b.type = 'button';
      const name = document.createElement('b'); name.textContent = p[0];
      const info = document.createElement('span');
      info.textContent = [p[7] && p[7] !== p[0] ? `(${p[7]})` : '', kindOf(p), p[4], p[5], d < 20000 ? `${d < 10 ? d.toFixed(1) : Math.round(d)} km` : ''].filter(Boolean).join(' · ');
      b.append(name, info);
      b.onclick = () => {
        found.hidden = true;
        map.flyTo({ center: [p[2], p[1]], zoom: zoomFor(p) });
        showPoint({ lat: p[1], lng: p[2] }, p[0]);
      };
      li.append(b); found.append(li);
    }
    found.hidden = false;
  }
  let timer, asked = 0;
  search.addEventListener('input', () => {
    clearTimeout(timer);
    const q = search.value.trim();
    if (q.length < 2) { found.hidden = true; return; }
    timer = setTimeout(async () => {
      const mine = ++asked, hits = await findPlaces(q);
      if (mine === asked) showFound(hits);   // only the latest typing counts
    }, 250);
  });
  search.addEventListener('keydown', e => { if (e.key === 'Enter') found.querySelector('button')?.click(); if (e.key === 'Escape') found.hidden = true; });
  search.addEventListener('focus', () => { if (found.children.length && search.value.trim().length >= 2) found.hidden = false; });

  map.on('moveend', () => SURVIVAL.store('map-view', JSON.stringify({ center: map.getCenter().toArray(), zoom: map.getZoom() })));
  document.addEventListener('themechange', e => map.setStyle(style(e.detail === 'dark')));

  const dms = (v, pos, neg) => {
    const ts = Math.round(Math.abs(v) * 36000) / 10;   // round to 0.1" first so 59.96" carries into the minute
    const d = Math.floor(ts / 3600), m = Math.floor((ts - d * 3600) / 60), s = (ts - d * 3600 - m * 60).toFixed(1);
    return `${d}°${m}'${s}"${v >= 0 ? pos : neg}`;
  };
  let marker = null;
  // a point tapped or found: marker, coordinates to read out, and remembered for the Tools page (sunrise, sun direction)
  function showPoint({ lat, lng }, title) {
    const dec = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    marker = marker || new maplibregl.Marker({ color: '#b4441c' });
    marker.setLngLat([lng, lat]).addTo(map);
    SURVIVAL.store('map-point', JSON.stringify({ lat, lng, title: title || '' }));
    found.hidden = true;
    panel.classList.remove('warn');
    const label = document.createElement('div'); label.className = 'muted'; label.textContent = title ? `${title}: ${t('map.share')}` : t('map.share');
    const big = document.createElement('div'); big.className = 'coords'; big.textContent = dec;
    const small = document.createElement('div'); small.className = 'muted'; small.textContent = `${dms(lat, 'N', 'S')}  ${dms(lng, 'E', 'W')}`;
    const btn = document.createElement('button'); btn.className = 'btn ghost'; btn.type = 'button'; btn.textContent = t('map.copy');
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(dec); btn.textContent = t('map.copied'); }
      catch { getSelection().selectAllChildren(big); }   // clipboard API needs a secure context; select the text instead
    };
    panel.replaceChildren(label, big, small, btn);
  }
  map.on('click', e => showPoint(e.lngLat));
})();
</script>
</body>
</html>
