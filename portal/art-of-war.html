// The text: a new translation from the classical Chinese (public domain, from Chinese Wikisource) into English and
// Portuguese, made for Survival Station and released into the public domain (CC0). Generated from the data below.
const BOOK = [{"zh":"始計第一","en":"1. Estimates","pt":"1. Avaliações","paras":[{"en":"Master Sun said: War is a great matter for the state. It is the ground of life and death, the road to survival or ruin. It must be examined with care.","pt":"Mestre Sun disse: A guerra é um grande assunto para o Estado. É o terreno da vida e da morte, o caminho para a sobrevivência ou para a ruína. Precisa ser examinada com cuidado."},{"en":"So weigh it by five things, compare the two sides by careful estimates, and look for the true situation. The first is the Way; the second, Heaven; the third, Earth; the fourth, the Commander; the fifth, Method.","pt":"Por isso, pese-a por cinco coisas, compare os dois lados com estimativas cuidadosas e procure a situação verdadeira. A primeira é o Caminho; a segunda, o Céu; a terceira, a Terra; a quarta, o Comandante; a quinta, o Método."},{"en":"The Way is what makes the people share the purpose of their leaders, so that they will die with them or live with them without fear of danger. Heaven is dark and light, cold and heat, and the order of the seasons. Earth is high and low, far and near, rough and easy, wide and narrow, ground of death and ground of life. The Commander is wisdom, trustworthiness, humanity, courage and strictness. Method is organisation, the chain of command and the management of supplies. Every commander has heard of these five; those who understand them win, those who do not, lose.","pt":"O Caminho é o que faz o povo compartilhar o propósito de seus líderes, de modo que morrerá com eles ou viverá com eles sem medo do perigo. O Céu é a escuridão e a luz, o frio e o calor, e a ordem das estações. A Terra é o alto e o baixo, o longe e o perto, o difícil e o fácil, o largo e o estreito, o terreno da morte e o terreno da vida. O Comandante é sabedoria, confiabilidade, humanidade, coragem e rigor. O Método é a organização, a cadeia de comando e a gestão dos suprimentos. Todo comandante já ouviu falar desses cinco; quem os entende vence, quem não os entende perde."},{"en":"So compare the sides with seven questions and look for the true situation. Which ruler has the Way? Which commander is more able? Who has the advantages of Heaven and Earth? Whose rules and orders are carried out? Whose troops are stronger? Whose soldiers are better trained? Whose rewards and punishments are clearer? With these I can tell who will win and who will lose.","pt":"Por isso, compare os lados com sete perguntas e procure a situação verdadeira. Qual governante tem o Caminho? Qual comandante é mais capaz? Quem tem as vantagens do Céu e da Terra? De quem as regras e as ordens são cumpridas? De quem as tropas são mais fortes? De quem os soldados são mais bem treinados? De quem as recompensas e os castigos são mais claros? Com isso eu sei quem vai vencer e quem vai perder."},{"en":"A commander who follows my estimates and is employed will surely win: keep him. A commander who does not follow my estimates and is employed will surely lose: send him away. Once the estimates show an advantage and are accepted, create a favourable position to support them from outside. A favourable position means using the advantage to take control of the situation.","pt":"O comandante que segue minhas estimativas e é empregado certamente vencerá: mantenha-o. O comandante que não segue minhas estimativas e é empregado certamente perderá: dispense-o. Quando as estimativas mostram uma vantagem e são aceitas, crie uma posição favorável que as apoie de fora. Posição favorável significa usar a vantagem para controlar a situação."},{"en":"War is the way of deception. So when able, appear unable; when active, appear inactive; when near, appear far; when far, appear near. Offer bait to lure them; take them when they are in disorder. When they are solid, prepare against them; when they are strong, avoid them. When they are angry, provoke them; when they are humble, make them proud. When they are rested, tire them; when they are united, divide them. Attack where they are unprepared; go out where they do not expect you. These are the strategist's means of victory, and they cannot be told in advance.","pt":"A guerra é o caminho do engano. Por isso, quando capaz, pareça incapaz; quando ativo, pareça inativo; quando perto, pareça longe; quando longe, pareça perto. Ofereça uma isca para atraí-los; tome-os quando estiverem em desordem. Quando estiverem firmes, prepare-se contra eles; quando forem fortes, evite-os. Quando estiverem irritados, provoque-os; quando forem humildes, torne-os orgulhosos. Quando estiverem descansados, canse-os; quando estiverem unidos, divida-os. Ataque onde não estão preparados; saia onde não esperam por você. Esses são os meios de vitória do estrategista, e não podem ser anunciados de antemão."},{"en":"Whoever wins in the temple's calculations before the battle has counted more advantages; whoever loses in the calculations has counted fewer. Many calculations win, few do not, and how much less none at all! Seen this way, victory and defeat are already clear.","pt":"Quem vence nos cálculos feitos no templo antes da batalha contou mais vantagens; quem perde nos cálculos contou menos. Muitos cálculos vencem, poucos não, e menos ainda nenhum! Vistos assim, a vitória e a derrota já ficam claras."}]},{"zh":"作戰第二","en":"2. Waging war","pt":"2. Fazer a guerra","paras":[{"en":"Master Sun said: In any campaign with a thousand fast chariots, a thousand armoured carts and a hundred thousand armoured soldiers, with food carried a thousand li, the costs at home and at the front, the entertaining of envoys, materials like glue and lacquer, and the upkeep of chariots and armour come to a thousand pieces of gold a day. Only then can an army of a hundred thousand be raised.","pt":"Mestre Sun disse: Em qualquer campanha com mil carros rápidos, mil carroças blindadas e cem mil soldados de armadura, com comida levada a mil li, os gastos em casa e na frente, a recepção de enviados, materiais como cola e laca e a manutenção de carros e armaduras chegam a mil moedas de ouro por dia. Só então se pode levantar um exército de cem mil."},{"en":"In battle, what counts is victory. If it drags on, weapons grow blunt and spirits dull; attack cities and strength runs out; keep the army long in the field and the state's resources will not suffice. When weapons are blunt, spirits dull, strength spent and wealth used up, other lords will rise to exploit your exhaustion, and even the wisest will not be able to set things right afterwards. So we have heard of war that was clumsy but quick; we have never seen one that was clever and long. No state has ever benefited from a long war. Whoever does not fully know the harm of war cannot fully know how to profit from it.","pt":"Na batalha, o que conta é a vitória. Se ela se arrasta, as armas perdem o fio e o ânimo esmorece; ataque cidades e as forças se esgotam; mantenha o exército muito tempo no campo e os recursos do Estado não bastarão. Quando as armas estão sem fio, o ânimo esmorecido, a força gasta e a riqueza consumida, outros senhores se levantarão para explorar seu esgotamento, e nem o mais sábio conseguirá consertar as coisas depois. Por isso já ouvimos falar de guerras desajeitadas mas rápidas; nunca vimos uma que fosse esperta e longa. Nenhum Estado jamais se beneficiou de uma guerra longa. Quem não conhece por inteiro o mal da guerra não pode conhecer por inteiro como tirar proveito dela."},{"en":"Those skilled in war do not raise troops a second time, nor carry provisions a third time. They take equipment from home but feed on the enemy, so the army has enough to eat.","pt":"Quem é hábil na guerra não convoca tropas uma segunda vez nem transporta provisões uma terceira vez. Leva o equipamento de casa, mas se alimenta à custa do inimigo, e assim o exército tem o bastante para comer."},{"en":"A state is made poor by its army through supplies carried far; carrying supplies far makes the people poor. Near the army, prices rise; high prices drain the people's wealth, and when their wealth is drained, they are pressed by levies. With strength spent and wealth gone, homes across the heartland are emptied: the people lose seven tenths of what they have, and the government loses six tenths to broken chariots and worn-out horses, armour and helmets, arrows and crossbows, halberds and shields, oxen and heavy carts.","pt":"Um Estado empobrece por causa de seu exército quando os suprimentos são levados para longe; levar suprimentos para longe empobrece o povo. Perto do exército, os preços sobem; preços altos esgotam a riqueza do povo, e quando sua riqueza se esgota, ele é pressionado por tributos. Com as forças gastas e a riqueza acabada, os lares do país se esvaziam: o povo perde sete décimos do que tem, e o governo perde seis décimos com carros quebrados e cavalos exaustos, armaduras e elmos, flechas e bestas, alabardas e escudos, bois e carroças pesadas."},{"en":"So a wise commander makes a point of feeding on the enemy. One measure of the enemy's food equals twenty of our own; one load of their fodder equals twenty of ours.","pt":"Por isso, o comandante sábio faz questão de se alimentar à custa do inimigo. Uma medida da comida do inimigo vale vinte das nossas; uma carga da forragem dele vale vinte das nossas."},{"en":"Killing the enemy comes from anger; taking the enemy's goods comes from reward. So in chariot battles, when ten or more chariots are captured, reward whoever took the first, change their flags to ours, mix the chariots in with ours and use them, and treat captured soldiers well and look after them. This is called defeating the enemy and growing stronger.","pt":"Matar o inimigo vem da raiva; tomar os bens do inimigo vem da recompensa. Por isso, nas batalhas de carros, quando dez ou mais carros forem capturados, recompense quem tomou o primeiro, troque as bandeiras deles pelas nossas, misture os carros aos nossos e use-os, e trate bem os soldados capturados e cuide deles. Isso se chama vencer o inimigo e ficar mais forte."},{"en":"So in war, value victory, not length. The commander who understands war holds the lives of the people in his hands and decides whether the nation is safe or in danger.","pt":"Por isso, na guerra, valorize a vitória, não a duração. O comandante que entende a guerra tem nas mãos a vida do povo e decide se a nação está segura ou em perigo."}]},{"zh":"謀攻第三","en":"3. Planning the attack","pt":"3. Planejar o ataque","paras":[{"en":"Master Sun said: In war, it is best to keep a state whole; to break it is second best. It is best to keep an army whole, a brigade whole, a company whole, a squad whole; to break them is second best. So a hundred victories in a hundred battles is not the best of the best. To overcome the enemy without fighting is the best of the best.","pt":"Mestre Sun disse: Na guerra, o melhor é manter um Estado inteiro; destruí-lo vem em segundo lugar. O melhor é manter inteiro um exército, uma brigada, uma companhia, um esquadrão; destruí-los vem em segundo lugar. Por isso, cem vitórias em cem batalhas não é o melhor dos melhores. Vencer o inimigo sem lutar é o melhor dos melhores."},{"en":"So the highest form of war is to defeat the enemy's plans; next, to break up their alliances; next, to attack their army; the lowest is to attack walled cities. Attack cities only when there is no other way. Preparing shields, siege towers and equipment takes three months, and building earth ramps against the walls three months more. If the commander cannot control his impatience and sends his men swarming up the walls like ants, a third of them will die and the city will still not fall. That is the disaster of attacking cities.","pt":"Por isso, a forma mais elevada de guerra é derrotar os planos do inimigo; a seguinte, desfazer suas alianças; a seguinte, atacar seu exército; a mais baixa é atacar cidades muradas. Ataque cidades só quando não houver outro jeito. Preparar escudos, torres de cerco e equipamentos leva três meses, e construir rampas de terra contra as muralhas, mais três meses. Se o comandante não controla a impaciência e manda seus homens subir as muralhas em enxame, como formigas, um terço deles morrerá e a cidade ainda não cairá. Esse é o desastre de atacar cidades."},{"en":"So those skilled in war overcome the enemy's army without fighting, take their cities without attacking, and bring down their state without a long campaign. They contend for the world with everything kept whole, so their troops are not worn out and the gain is complete. This is the method of planning the attack.","pt":"Por isso, quem é hábil na guerra vence o exército do inimigo sem lutar, toma suas cidades sem atacá-las e derruba seu Estado sem uma longa campanha. Disputa o mundo mantendo tudo inteiro, de modo que suas tropas não se desgastam e o ganho é completo. Esse é o método de planejar o ataque."},{"en":"So the rule in war: ten to one, surround them; five to one, attack them; two to one, divide them; equal, be able to fight them; fewer, be able to defend; much weaker, be able to avoid them. A small force that stubbornly holds out is captured by a large one.","pt":"Por isso, a regra na guerra: dez contra um, cerque-os; cinco contra um, ataque-os; dois contra um, divida-os; em igualdade, seja capaz de enfrentá-los; em menor número, seja capaz de se defender; muito mais fraco, seja capaz de evitá-los. Uma força pequena que resiste com teimosia é capturada por uma grande."},{"en":"The commander is the support of the state. If the support is complete, the state will surely be strong; if it has gaps, the state will surely be weak.","pt":"O comandante é o apoio do Estado. Se o apoio for completo, o Estado certamente será forte; se tiver falhas, o Estado certamente será fraco."},{"en":"There are three ways a ruler brings trouble on the army. Not knowing that the army cannot advance and ordering it to advance, or not knowing that it cannot retreat and ordering it to retreat: this is called tying up the army. Not knowing the army's affairs yet sharing in its administration: the soldiers become confused. Not knowing how the army must adapt yet sharing in its command: the soldiers become doubtful. When the army is confused and doubtful, trouble from the other lords arrives. This is called throwing the army into disorder and giving away the victory.","pt":"Há três maneiras de um governante trazer problemas ao exército. Não saber que o exército não pode avançar e mandá-lo avançar, ou não saber que não pode recuar e mandá-lo recuar: isso se chama amarrar o exército. Não conhecer os assuntos do exército e mesmo assim participar de sua administração: os soldados ficam confusos. Não saber como o exército precisa se adaptar e mesmo assim participar do comando: os soldados ficam em dúvida. Quando o exército está confuso e em dúvida, chegam os problemas vindos dos outros senhores. Isso se chama lançar o exército na desordem e entregar a vitória."},{"en":"So there are five ways to know who will win. Whoever knows when to fight and when not to fight will win. Whoever knows how to use large and small forces will win. Whoever's leaders and soldiers share the same desire will win. Whoever is prepared and waits for the unprepared will win. Whoever has an able commander not interfered with by the ruler will win. These five are the way to know victory.","pt":"Por isso, há cinco maneiras de saber quem vai vencer. Vence quem sabe quando lutar e quando não lutar. Vence quem sabe usar forças grandes e pequenas. Vence aquele cujos líderes e soldados têm o mesmo desejo. Vence quem está preparado e espera pelo despreparado. Vence quem tem um comandante capaz, sem interferência do governante. Esses cinco são o caminho para conhecer a vitória."},{"en":"So it is said: know the other and know yourself, and in a hundred battles you will not be in danger. Not knowing the other but knowing yourself, you will win one and lose one. Knowing neither the other nor yourself, you will be in danger in every battle.","pt":"Por isso se diz: conheça o outro e conheça a si mesmo, e em cem batalhas não correrá perigo. Sem conhecer o outro, mas conhecendo a si mesmo, vencerá uma e perderá outra. Sem conhecer nem o outro nem a si mesmo, correrá perigo em todas as batalhas."}]},{"zh":"軍形第四","en":"4. Positioning","pt":"4. Posicionamento","paras":[{"en":"Master Sun said: The skilled warriors of old first made themselves impossible to defeat, then waited for the enemy to become possible to defeat. Being impossible to defeat depends on yourself; being possible to defeat depends on the enemy. So the skilled can make themselves impossible to defeat, but cannot make the enemy certain to be defeated. So it is said: victory can be known, but it cannot be forced.","pt":"Mestre Sun disse: Os guerreiros hábeis de antigamente primeiro se tornavam impossíveis de derrotar e depois esperavam que o inimigo se tornasse possível de derrotar. Ser impossível de derrotar depende de você; ser possível de derrotar depende do inimigo. Por isso, os hábeis conseguem se tornar impossíveis de derrotar, mas não conseguem tornar certa a derrota do inimigo. Por isso se diz: a vitória pode ser conhecida, mas não pode ser forçada."},{"en":"Being impossible to defeat is defence; making the enemy possible to defeat is attack. Defend when your strength is not enough; attack when you have more than enough. Those skilled in defence hide below the nine layers of the earth; those skilled in attack move above the nine layers of heaven. So they can protect themselves and win completely.","pt":"Ser impossível de derrotar é defesa; tornar o inimigo possível de derrotar é ataque. Defenda quando sua força não basta; ataque quando tem força de sobra. Os hábeis na defesa se escondem abaixo das nove camadas da terra; os hábeis no ataque se movem acima das nove camadas do céu. Assim, conseguem se proteger e vencer por completo."},{"en":"To see a victory that everyone can see is not the best of the best. To win a battle and have the whole world say 'well done' is not the best of the best. Lifting an autumn hair is no sign of strength; seeing the sun and moon is no sign of sharp eyes; hearing thunder is no sign of keen ears.","pt":"Ver uma vitória que todos conseguem ver não é o melhor dos melhores. Vencer uma batalha e todo o mundo dizer 'muito bem' não é o melhor dos melhores. Levantar um fio de pelo de outono não é sinal de força; ver o sol e a lua não é sinal de olhos aguçados; ouvir o trovão não é sinal de ouvidos atentos."},{"en":"What the ancients called skilled in war was winning where winning was easy. So the victories of the skilled bring neither a name for wisdom nor credit for courage. Their victories do not go wrong; not going wrong means that whatever they set up is sure to win, because they defeat an enemy that has already lost. So the skilled take their stand where they cannot be defeated and do not miss the enemy's moment of defeat. So a winning army first wins and then seeks battle; a losing army first fights and then seeks victory. Those skilled in war cultivate the Way and keep to Method, so they can govern victory and defeat.","pt":"O que os antigos chamavam de hábil na guerra era vencer onde vencer era fácil. Por isso, as vitórias dos hábeis não trazem fama de sabedoria nem mérito de coragem. Suas vitórias não falham; não falhar significa que tudo o que preparam certamente vence, porque derrotam um inimigo que já perdeu. Por isso, os hábeis se firmam onde não podem ser derrotados e não perdem o momento da derrota do inimigo. Assim, um exército vencedor primeiro vence e depois busca a batalha; um exército derrotado primeiro luta e depois busca a vitória. Quem é hábil na guerra cultiva o Caminho e mantém o Método, e assim consegue governar a vitória e a derrota."},{"en":"In the method of war, first is measuring, second is estimating quantities, third is counting, fourth is weighing, fifth is victory. The ground gives rise to measuring, measuring to estimating, estimating to counting, counting to weighing, and weighing to victory. So a winning army is like a heavy weight set against a grain, and a losing army like a grain set against a heavy weight. The winner sends his people into battle like a dammed-up flood released into a gorge a thousand fathoms deep: that is positioning.","pt":"No método da guerra, primeiro vem medir, segundo estimar as quantidades, terceiro contar, quarto pesar, quinto a vitória. O terreno dá origem à medida, a medida à estimativa, a estimativa à contagem, a contagem à pesagem, e a pesagem à vitória. Assim, um exército vencedor é como um peso grande contra um grão, e um exército derrotado como um grão contra um peso grande. O vencedor lança seu povo na batalha como uma enchente represada que se solta num desfiladeiro de mil braças de profundidade: isso é o posicionamento."}]},{"zh":"兵勢第五","en":"5. Momentum","pt":"5. Impulso","paras":[{"en":"Master Sun said: Managing many is like managing few: it is a matter of dividing them into units. Fighting with many is like fighting with few: it is a matter of formations and signals. That a whole army can meet the enemy without being defeated is a matter of the unexpected and the expected. That the army strikes like a grindstone thrown at an egg is a matter of empty and full.","pt":"Mestre Sun disse: Comandar muitos é como comandar poucos: é uma questão de dividi-los em unidades. Lutar com muitos é como lutar com poucos: é uma questão de formações e sinais. Que todo um exército possa enfrentar o inimigo sem ser derrotado é uma questão do inesperado e do esperado. Que o exército golpeie como uma pedra de amolar lançada contra um ovo é uma questão do vazio e do cheio."},{"en":"In all battles, engage with the expected and win with the unexpected. Those skilled at the unexpected are as endless as heaven and earth, as inexhaustible as the great rivers and the sea. They end and begin again, like the sun and moon; they die and are born again, like the four seasons. There are only five notes, yet their combinations are more than can ever be heard. There are only five colours, yet their combinations are more than can ever be seen. There are only five flavours, yet their combinations are more than can ever be tasted. In battle there are only the unexpected and the expected, yet their combinations can never be exhausted. They give rise to each other like a circle without end: who could ever exhaust them?","pt":"Em todas as batalhas, engaje com o esperado e vença com o inesperado. Quem é hábil no inesperado é infinito como o céu e a terra, inesgotável como os grandes rios e o mar. Termina e recomeça, como o sol e a lua; morre e renasce, como as quatro estações. Há só cinco notas, mas suas combinações são mais do que jamais se poderá ouvir. Há só cinco cores, mas suas combinações são mais do que jamais se poderá ver. Há só cinco sabores, mas suas combinações são mais do que jamais se poderá provar. Na batalha há só o inesperado e o esperado, mas suas combinações nunca se esgotam. Um dá origem ao outro, como um círculo sem fim: quem poderia esgotá-los?"},{"en":"Rushing water that tosses boulders: that is momentum. A hawk that strikes and breaks its prey: that is timing. So the skilled warrior's momentum is steep and his timing short. Momentum is like a drawn crossbow; timing is like pulling the trigger.","pt":"A água que corre e arrasta pedras: isso é impulso. O falcão que ataca e quebra a presa: isso é o momento certo. Por isso, o impulso do guerreiro hábil é íngreme e seu momento, curto. O impulso é como uma besta retesada; o momento certo é como puxar o gatilho."},{"en":"Amid the swirl and tumult of battle, the fighting may look chaotic, yet the army is not in chaos. Amid the confusion, the formation may look shapeless, yet it cannot be defeated. Apparent disorder comes from order; apparent fear from courage; apparent weakness from strength. Order and disorder are a matter of organisation; courage and fear, of momentum; strength and weakness, of positioning.","pt":"No redemoinho e no tumulto da batalha, o combate pode parecer caótico, e ainda assim o exército não está em caos. Na confusão, a formação pode parecer sem forma, e ainda assim não pode ser derrotada. A desordem aparente vem da ordem; o medo aparente, da coragem; a fraqueza aparente, da força. Ordem e desordem são uma questão de organização; coragem e medo, de impulso; força e fraqueza, de posicionamento."},{"en":"So those skilled at moving the enemy show a form, and the enemy follows it; offer something, and the enemy takes it. They move the enemy with advantage and wait for them with their troops.","pt":"Por isso, quem é hábil em mover o inimigo mostra uma aparência, e o inimigo a segue; oferece algo, e o inimigo o pega. Move o inimigo com vantagens e o espera com suas tropas."},{"en":"So the skilled warrior looks for victory in momentum and does not demand it of individuals; so he can choose his people and rely on momentum. Whoever relies on momentum sends people into battle like rolling logs and stones. It is the nature of logs and stones to stay still on flat ground and to move on a slope; square, they stop; round, they roll. So the momentum of skilled fighters is like round boulders rolling down a mountain a thousand fathoms high: that is momentum.","pt":"Por isso, o guerreiro hábil busca a vitória no impulso e não a exige dos indivíduos; assim, pode escolher sua gente e confiar no impulso. Quem confia no impulso lança as pessoas na batalha como troncos e pedras rolando. É da natureza dos troncos e das pedras ficar parados no chão plano e se mover na ladeira; quadrados, param; redondos, rolam. Assim, o impulso dos bons combatentes é como pedras redondas rolando por uma montanha de mil braças de altura: isso é impulso."}]},{"zh":"虛實第六","en":"6. Empty and full","pt":"6. O vazio e o cheio","paras":[{"en":"Master Sun said: Whoever takes the battlefield first and waits for the enemy is rested; whoever arrives later and rushes into battle is weary. So the skilled bring the enemy to them and are not brought by the enemy.","pt":"Mestre Sun disse: Quem ocupa primeiro o campo de batalha e espera o inimigo está descansado; quem chega depois e corre para a batalha está cansado. Por isso, os hábeis trazem o inimigo até eles e não são levados pelo inimigo."},{"en":"What makes the enemy come of their own accord is the prospect of gain; what keeps them from coming is the prospect of harm. So when the enemy is rested, tire them; when well fed, starve them; when settled, move them. Go where they cannot hurry to; hurry where they do not expect.","pt":"O que faz o inimigo vir por conta própria é a perspectiva de ganho; o que o impede de vir é a perspectiva de dano. Por isso, quando o inimigo estiver descansado, canse-o; quando bem alimentado, deixe-o com fome; quando acomodado, faça-o se mover. Vá onde ele não consegue chegar depressa; vá depressa onde ele não espera."},{"en":"An army can march a thousand li without tiring if it marches where there is no enemy. To be sure of taking what you attack, attack what is not defended. To be sure of holding what you defend, defend what cannot be attacked. So against those skilled in attack, the enemy does not know what to defend; against those skilled in defence, the enemy does not know what to attack. Subtle, subtle, to the point of having no form; mysterious, mysterious, to the point of making no sound: so they hold the enemy's fate in their hands.","pt":"Um exército pode marchar mil li sem se cansar se marcha onde não há inimigo. Para ter certeza de tomar o que ataca, ataque o que não está defendido. Para ter certeza de manter o que defende, defenda o que não pode ser atacado. Assim, diante dos hábeis no ataque, o inimigo não sabe o que defender; diante dos hábeis na defesa, o inimigo não sabe o que atacar. Sutil, sutil, a ponto de não ter forma; misterioso, misterioso, a ponto de não fazer som: assim têm nas mãos o destino do inimigo."},{"en":"Advance where they cannot resist by striking their empty places; retreat where they cannot pursue by being too fast to catch. So when we want to fight, even if the enemy sits behind high walls and deep moats, they must fight us, because we attack what they must rescue. When we do not want to fight, even if we only draw a line on the ground to hold, the enemy cannot fight us, because we divert them from where they mean to go.","pt":"Avance onde não podem resistir, golpeando seus lugares vazios; recue onde não podem perseguir, sendo rápido demais para ser alcançado. Por isso, quando queremos lutar, mesmo que o inimigo esteja atrás de muralhas altas e fossos fundos, ele precisa lutar conosco, porque atacamos o que ele precisa socorrer. Quando não queremos lutar, mesmo que só risquemos uma linha no chão para defender, o inimigo não consegue lutar conosco, porque o desviamos de onde pretende ir."},{"en":"So if we make the enemy show their form while we have none, we are concentrated and they are divided. We are one, they are split into ten: that is ten of us attacking one of them. So we are many and they are few. If we can strike the few with the many, those we fight will be in difficulty. The place where we will fight must not be known. If it is not known, the enemy must prepare in many places; and if they prepare in many places, those we face at any one place will be few. Prepare the front and the rear is weak; prepare the rear and the front is weak; prepare the left and the right is weak; prepare the right and the left is weak; prepare everywhere and everywhere is weak. Being few comes from preparing against others; being many comes from making others prepare against you.","pt":"Assim, se fazemos o inimigo mostrar sua forma enquanto não temos nenhuma, estamos concentrados e ele, dividido. Somos um, ele se parte em dez: são dez dos nossos atacando um dos deles. Assim, somos muitos e eles, poucos. Se conseguimos golpear os poucos com os muitos, aqueles que enfrentamos estarão em dificuldade. O lugar onde vamos lutar não pode ser conhecido. Se não for conhecido, o inimigo precisa se preparar em muitos lugares; e se se prepara em muitos lugares, os que enfrentamos em cada lugar serão poucos. Prepare a frente e a retaguarda fica fraca; prepare a retaguarda e a frente fica fraca; prepare a esquerda e a direita fica fraca; prepare a direita e a esquerda fica fraca; prepare-se em toda parte e em toda parte fica fraco. Ser poucos vem de se preparar contra os outros; ser muitos vem de fazer os outros se prepararem contra você."},{"en":"So if you know the place and the day of battle, you can march a thousand li and meet to fight. If you know neither the place nor the day, the left cannot help the right, the right cannot help the left, the front cannot help the rear and the rear cannot help the front, let alone units tens of li or even a few li apart! By my reckoning, though the soldiers of Yue are many, what does that add to their victory? So it is said: victory can be made. Even if the enemy is numerous, they can be kept from fighting.","pt":"Assim, se você conhece o lugar e o dia da batalha, pode marchar mil li e se reunir para lutar. Se não conhece nem o lugar nem o dia, a esquerda não pode ajudar a direita, a direita não pode ajudar a esquerda, a frente não pode ajudar a retaguarda e a retaguarda não pode ajudar a frente, quanto mais unidades a dezenas de li ou mesmo a poucos li de distância! Pelas minhas contas, ainda que os soldados de Yue sejam muitos, o que isso acrescenta à vitória deles? Por isso se diz: a vitória pode ser construída. Mesmo que o inimigo seja numeroso, pode-se impedi-lo de lutar."},{"en":"So assess them to learn what will succeed and what will fail; stir them to learn the pattern of their movement and stillness; make them show their form to learn their ground of life and death; probe them to learn where they have too much and where too little. The height of positioning an army is to have no form. With no form, the deepest spy cannot see in and the wisest cannot make plans. Victory is placed before the crowd according to form, and the crowd cannot understand it. Everyone can see the form by which I win, but no one sees the form from which I shape victory. So do not repeat the same victory, but respond to forms without end.","pt":"Por isso, avalie-os para saber o que dará certo e o que dará errado; provoque-os para conhecer o padrão de seu movimento e de sua quietude; faça-os mostrar sua forma para conhecer seu terreno de vida e de morte; sonde-os para saber onde têm demais e onde têm de menos. O auge do posicionamento de um exército é não ter forma. Sem forma, o espião mais infiltrado não consegue ver e o mais sábio não consegue fazer planos. A vitória é colocada diante da multidão de acordo com a forma, e a multidão não consegue entendê-la. Todos veem a forma pela qual eu venço, mas ninguém vê a forma a partir da qual construo a vitória. Por isso, não repita a mesma vitória, mas responda às formas sem fim."},{"en":"An army's form is like water. Water flows away from the high and runs to the low; an army's victory avoids the full and strikes the empty. Water shapes its flow by the ground; an army shapes its victory by the enemy. So an army has no fixed momentum and no constant form. Whoever can change with the enemy and win is called divine. Of the five elements none always prevails; of the four seasons none keeps its place; days are short and long; the moon wanes and waxes.","pt":"A forma de um exército é como a água. A água foge do alto e corre para o baixo; a vitória de um exército evita o cheio e golpeia o vazio. A água molda seu fluxo pelo terreno; o exército molda sua vitória pelo inimigo. Por isso, um exército não tem impulso fixo nem forma constante. Quem consegue mudar com o inimigo e vencer é chamado de divino. Dos cinco elementos, nenhum sempre prevalece; das quatro estações, nenhuma mantém seu lugar; os dias são curtos e longos; a lua míngua e cresce."}]},{"zh":"軍爭第七","en":"7. The contest for advantage","pt":"7. A disputa pela vantagem","paras":[{"en":"Master Sun said: In war, the commander receives orders from the ruler, gathers the army, assembles the troops and camps facing the enemy. Nothing is harder than the contest for advantage. Its difficulty is to turn the roundabout into the direct and misfortune into gain. So take a roundabout route and lure the enemy with gain; set out after them and arrive before them: this is knowing the calculation of the roundabout and the direct.","pt":"Mestre Sun disse: Na guerra, o comandante recebe ordens do governante, reúne o exército, junta as tropas e acampa diante do inimigo. Nada é mais difícil do que a disputa pela vantagem. Sua dificuldade é transformar o caminho indireto em direto e o infortúnio em ganho. Por isso, tome um caminho indireto e atraia o inimigo com um ganho; parta depois dele e chegue antes dele: isso é conhecer o cálculo do indireto e do direto."},{"en":"The contest for advantage brings gain and brings danger. Move the whole army to seize an advantage and you will be too slow; leave the army behind to seize it and the baggage will be lost. So if the troops roll up their armour and hurry, not stopping day or night, marching double distance to contend for an advantage a hundred li away, all three commanders will be captured: the strong arrive first, the tired fall behind, and only one in ten gets there. Contend over fifty li and the commander of the vanguard falls, and half arrive. Contend over thirty li and two thirds arrive. So an army without its baggage is lost; without food it is lost; without stores it is lost. Whoever does not know the plans of the neighbouring lords cannot make alliances in advance. Whoever does not know the shape of mountains and forests, gorges and passes, marshes and swamps cannot march an army. Whoever does not use local guides cannot gain the advantage of the ground.","pt":"A disputa pela vantagem traz ganho e traz perigo. Mova o exército inteiro para tomar uma vantagem e você será lento demais; deixe o exército para trás para tomá-la e a bagagem se perderá. Assim, se as tropas enrolam as armaduras e correm, sem parar dia e noite, marchando o dobro da distância para disputar uma vantagem a cem li, os três comandantes serão capturados: os fortes chegam primeiro, os cansados ficam para trás, e só um em dez chega. Dispute a cinquenta li e o comandante da vanguarda cai, e metade chega. Dispute a trinta li e dois terços chegam. Por isso, um exército sem bagagem está perdido; sem comida está perdido; sem estoques está perdido. Quem não conhece os planos dos senhores vizinhos não pode fazer alianças com antecedência. Quem não conhece a forma das montanhas e florestas, desfiladeiros e passagens, pântanos e brejos não pode fazer marchar um exército. Quem não usa guias locais não pode obter a vantagem do terreno."},{"en":"So war is founded on deception, moves by advantage, and changes by dividing and combining. Be swift as the wind, steady as the forest, raid like fire, unmoving as a mountain, hard to know as the dark, and move like thunder. When you plunder the countryside, share it among the troops; when you gain ground, share out the advantage; weigh things before you move. Whoever first knows the calculation of the roundabout and the direct will win. This is the method of the contest for advantage.","pt":"Por isso, a guerra se funda no engano, se move pela vantagem e muda dividindo e combinando. Seja rápido como o vento, firme como a floresta, ataque como o fogo, imóvel como a montanha, difícil de conhecer como a escuridão, e mova-se como o trovão. Quando saquear o campo, divida entre as tropas; quando ganhar terreno, reparta a vantagem; pese as coisas antes de se mover. Quem primeiro conhece o cálculo do indireto e do direto vencerá. Esse é o método da disputa pela vantagem."},{"en":"The Book of Army Management says: 'Voices cannot be heard, so we use gongs and drums; people cannot see each other, so we use banners and flags.' Gongs, drums, banners and flags unite the ears and eyes of the people. Once the people are united, the brave cannot advance alone and the timid cannot retreat alone. This is the method of using large numbers. So in night battles use many fires and drums; in day battles use many banners and flags, to adapt to people's ears and eyes.","pt":"O Livro da Administração do Exército diz: 'As vozes não se ouvem, por isso usamos gongos e tambores; as pessoas não se veem, por isso usamos estandartes e bandeiras.' Gongos, tambores, estandartes e bandeiras unem os ouvidos e os olhos do povo. Uma vez unido o povo, os corajosos não podem avançar sozinhos e os tímidos não podem recuar sozinhos. Esse é o método de usar grandes números. Por isso, nas batalhas noturnas use muitos fogos e tambores; nas batalhas de dia use muitos estandartes e bandeiras, para se adaptar aos ouvidos e aos olhos das pessoas."},{"en":"A whole army can be robbed of its spirit; a commander can be robbed of his resolve. In the morning spirits are keen, by midday they flag, and by evening they turn towards home. So those skilled in war avoid the enemy when their spirit is keen and strike when it flags and turns homeward: this is mastering spirit. Meet disorder with order and noise with calm: this is mastering the mind. Meet the far with the near, the weary with the rested, the hungry with the fed: this is mastering strength. Do not intercept banners in perfect order, do not attack a formation in full array: this is mastering change.","pt":"Todo um exército pode perder o ânimo; um comandante pode perder a determinação. De manhã o ânimo é vivo, ao meio-dia esmorece e à tarde se volta para casa. Por isso, os hábeis na guerra evitam o inimigo quando seu ânimo está vivo e o golpeiam quando esmorece e se volta para casa: isso é dominar o ânimo. Enfrente a desordem com ordem e o barulho com calma: isso é dominar a mente. Enfrente o distante com o próximo, o cansado com o descansado, o faminto com o alimentado: isso é dominar a força. Não intercepte bandeiras em ordem perfeita, não ataque uma formação bem arrumada: isso é dominar a mudança."},{"en":"So the rules of war: do not attack uphill; do not oppose an enemy coming downhill with a hill at their back; do not pursue a feigned retreat; do not attack crack troops; do not take the bait; do not block an army going home; leave a way out when you surround an army; do not press a desperate enemy too hard. These are the rules of war.","pt":"Por isso, as regras da guerra: não ataque morro acima; não enfrente um inimigo que desce com o morro às costas; não persiga uma fuga fingida; não ataque tropas de elite; não morda a isca; não bloqueie um exército que volta para casa; deixe uma saída ao cercar um exército; não pressione demais um inimigo desesperado. Essas são as regras da guerra."}]},{"zh":"九變第八","en":"8. The nine variations","pt":"8. As nove variações","paras":[{"en":"Master Sun said: In war, the commander receives orders from the ruler, gathers the army and assembles the troops. On broken ground, do not camp. On ground where roads meet, join with allies. On cut-off ground, do not linger. On enclosed ground, use strategy. On deadly ground, fight. There are roads not to take, armies not to attack, cities not to besiege, ground not to contest, and orders of the ruler not to obey. A commander who understands the advantages of the nine variations knows how to use troops. A commander who does not, even if he knows the lie of the land, cannot gain its advantage. One who directs troops without knowing the art of the nine variations, even if he knows the five advantages, cannot get the best from his people.","pt":"Mestre Sun disse: Na guerra, o comandante recebe ordens do governante, reúne o exército e junta as tropas. Em terreno acidentado, não acampe. Em terreno onde as estradas se cruzam, una-se aos aliados. Em terreno isolado, não se demore. Em terreno cercado, use a estratégia. Em terreno mortal, lute. Há estradas que não se devem tomar, exércitos que não se devem atacar, cidades que não se devem sitiar, terrenos que não se devem disputar e ordens do governante que não se devem obedecer. O comandante que entende as vantagens das nove variações sabe usar as tropas. O que não entende, mesmo que conheça o relevo, não consegue tirar proveito dele. Quem dirige tropas sem conhecer a arte das nove variações, mesmo que conheça as cinco vantagens, não consegue tirar o melhor de sua gente."},{"en":"So the wise always weigh both gain and harm. Weighing gain, their plans can be trusted; weighing harm, their troubles can be resolved. So subdue other lords with harm, keep them busy with tasks, and make them rush about with the prospect of gain.","pt":"Por isso, os sábios sempre pesam o ganho e o dano juntos. Pesando o ganho, seus planos merecem confiança; pesando o dano, seus problemas podem ser resolvidos. Assim, submeta os outros senhores com o dano, mantenha-os ocupados com tarefas e faça-os correr com a perspectiva de ganho."},{"en":"So the rule of war: do not count on the enemy not coming, but on being ready for them; do not count on the enemy not attacking, but on having made yourself impossible to attack.","pt":"Por isso, a regra da guerra: não conte com o inimigo não vir, mas com estar pronto para ele; não conte com o inimigo não atacar, mas com ter se tornado impossível de atacar."},{"en":"A commander has five dangerous traits. Reckless, he can be killed. Cowardly, he can be captured. Quick-tempered, he can be provoked by insults. Too proud of his honour, he can be shamed. Too attached to his people, he can be worn down with worry. These five are the commander's faults and a disaster for the army. When an army is destroyed and its commander killed, the cause is always among these five dangers. They must be examined.","pt":"Um comandante tem cinco traços perigosos. Imprudente, pode ser morto. Covarde, pode ser capturado. Esquentado, pode ser provocado com insultos. Orgulhoso demais da própria honra, pode ser envergonhado. Apegado demais à sua gente, pode ser desgastado pela preocupação. Esses cinco são os defeitos do comandante e um desastre para o exército. Quando um exército é destruído e seu comandante morto, a causa sempre está entre esses cinco perigos. Precisam ser examinados."}]},{"zh":"行軍第九","en":"9. The army on the move","pt":"9. O exército em marcha","paras":[{"en":"Master Sun said: In positioning the army and reading the enemy: cross mountains by keeping to the valleys; camp on high ground facing the sun; do not climb to fight an enemy on the heights. This is positioning in the mountains. After crossing water, move well away from it. When the enemy crosses water towards you, do not meet them in the water: let half of them cross, then strike, and you will gain. If you want to fight, do not meet the enemy right at the water's edge; camp on high ground facing the sun, and do not position yourself downstream of them. This is positioning by rivers. Cross salt marshes quickly, without lingering; if you must fight in one, keep to water and grass with a stand of trees at your back. This is positioning in marshes. On open plains, take easy ground with higher ground to your right and behind, danger in front and safety behind. This is positioning on plains. These four advantages are how the Yellow Emperor defeated the four emperors.","pt":"Mestre Sun disse: Ao posicionar o exército e observar o inimigo: atravesse as montanhas seguindo os vales; acampe em terreno alto, de frente para o sol; não suba para lutar com um inimigo nas alturas. Esse é o posicionamento nas montanhas. Depois de atravessar um rio, afaste-se bem dele. Quando o inimigo atravessa um rio em sua direção, não o enfrente dentro da água: deixe metade atravessar e então ataque, e você terá vantagem. Se quiser lutar, não enfrente o inimigo bem na beira da água; acampe em terreno alto, de frente para o sol, e não se posicione rio abaixo dele. Esse é o posicionamento junto aos rios. Atravesse os pântanos salgados depressa, sem se demorar; se tiver de lutar num deles, fique perto da água e do capim, com um grupo de árvores às costas. Esse é o posicionamento nos pântanos. Nas planícies abertas, ocupe terreno fácil, com o terreno mais alto à sua direita e atrás, o perigo à frente e a segurança atrás. Esse é o posicionamento nas planícies. Essas quatro vantagens são como o Imperador Amarelo venceu os quatro imperadores."},{"en":"An army prefers high ground to low and sunlit places to shade. Look after the troops' health and camp on solid ground, and the army will be free of the hundred diseases: this means certain victory. On hills and embankments, take the sunny side with the slope to your right and behind. This is the army's gain and the help of the ground. When it has rained upstream and foam comes down the river, whoever wants to cross must wait until it settles.","pt":"Um exército prefere o terreno alto ao baixo e os lugares ensolarados à sombra. Cuide da saúde das tropas e acampe em chão firme, e o exército ficará livre das cem doenças: isso significa vitória certa. Em morros e barrancos, ocupe o lado do sol, com a encosta à sua direita e atrás. Esse é o ganho do exército e a ajuda do terreno. Quando choveu rio acima e desce espuma pelo rio, quem quiser atravessar deve esperar que a água se acalme."},{"en":"Where there are sheer ravines, deep natural wells, natural prisons, natural nets, natural pits and natural crevices, leave quickly and do not approach. Keep away from them and let the enemy near them; face them yourself and let the enemy have them at their back. If beside the army there are gorges, ponds, reeds, woods or thick undergrowth, search them carefully and repeatedly: these are where ambushes and spies hide.","pt":"Onde houver ravinas íngremes, poços naturais profundos, prisões naturais, redes naturais, buracos naturais e fendas naturais, saia depressa e não se aproxime. Fique longe deles e deixe o inimigo perto; fique de frente para eles e deixe o inimigo de costas para eles. Se ao lado do exército houver desfiladeiros, lagoas, juncos, matas ou vegetação fechada, reviste-os com cuidado e várias vezes: é ali que se escondem emboscadas e espiões."},{"en":"An enemy close by and quiet relies on strong ground. An enemy far off who challenges you wants you to advance. If they camp on easy ground, they have some advantage. Many trees moving: they are coming. Many screens in the grass: they want to mislead. Birds rising: an ambush. Animals startled: a surprise attack. Dust high and pointed: chariots coming. Low and wide: infantry coming. Scattered in strands: men gathering firewood. A little, moving back and forth: they are making camp. Humble words while they increase preparations: they will advance. Strong words and a show of advancing: they will retreat. Light chariots out first, on the flanks: they are forming up. Asking for peace without any agreement: a plot. Running about and lining up: the moment has come. Half advancing, half retreating: a lure. Leaning on their weapons: they are hungry. Water-carriers drinking first: they are thirsty. Seeing a gain and not moving for it: they are exhausted. Birds gathering: the place is empty. Shouting at night: they are afraid. Disorder in the camp: the commander has no authority. Flags moving about: confusion. Officers angry: the men are weary. Feeding grain to the horses, eating their own livestock, no pots hung, not returning to their tents: they are desperate. Talking quietly and slowly in small groups: the commander has lost his people. Frequent rewards: they are in difficulty. Frequent punishments: they are in trouble. Harsh at first and then afraid of their own men: the height of incompetence. Envoys coming with apologies: they want a rest. If angry troops come to face you and stay a long time without fighting or leaving, watch them very carefully.","pt":"Um inimigo perto e quieto confia num terreno forte. Um inimigo longe que desafia quer que você avance. Se acampa em terreno fácil, tem alguma vantagem. Muitas árvores se mexendo: estão vindo. Muitos anteparos no capim: querem enganar. Pássaros levantando voo: uma emboscada. Animais assustados: um ataque surpresa. Poeira alta e pontuda: carros vindo. Baixa e larga: infantaria vindo. Espalhada em fios: homens juntando lenha. Pouca, indo e vindo: estão acampando. Palavras humildes enquanto aumentam os preparativos: vão avançar. Palavras duras e aparência de avanço: vão recuar. Carros leves saindo primeiro, pelos flancos: estão entrando em formação. Pedido de paz sem nenhum acordo: uma trama. Correria e soldados em fila: chegou o momento. Metade avança, metade recua: uma isca. Apoiados nas armas: estão com fome. Os carregadores de água bebem primeiro: estão com sede. Veem um ganho e não se mexem para pegá-lo: estão exaustos. Pássaros se juntando: o lugar está vazio. Gritos à noite: estão com medo. Desordem no acampamento: o comandante não tem autoridade. Bandeiras mudando de lugar: confusão. Oficiais irritados: os homens estão cansados. Dando grãos aos cavalos, comendo o próprio gado, sem panelas penduradas, sem voltar às barracas: estão desesperados. Conversando baixo e devagar em pequenos grupos: o comandante perdeu sua gente. Recompensas frequentes: estão em dificuldade. Castigos frequentes: estão em apuros. Duros no começo e depois com medo dos próprios homens: o cúmulo da incompetência. Enviados vindo com desculpas: querem descansar. Se tropas irritadas vêm enfrentá-lo e ficam muito tempo sem lutar nem ir embora, observe-as com muito cuidado."},{"en":"Numbers alone are no advantage. Only do not advance recklessly; it is enough to concentrate your strength, read the enemy and win people over. Whoever does not think ahead and takes the enemy lightly will surely be captured.","pt":"O número sozinho não é vantagem. Apenas não avance de forma imprudente; basta concentrar a força, entender o inimigo e conquistar as pessoas. Quem não pensa à frente e subestima o inimigo certamente será capturado."},{"en":"Punish soldiers before they are attached to you and they will not obey; if they do not obey, they are hard to use. Once they are attached to you, if punishments are not carried out, they cannot be used. So command them with kindness and unite them with discipline: this means certain success. If orders are consistently carried out in training the people, the people obey; if not, they do not. Orders consistently carried out mean that leader and people trust each other.","pt":"Castigue os soldados antes que estejam ligados a você e eles não obedecerão; se não obedecem, são difíceis de usar. Depois que estiverem ligados a você, se os castigos não forem aplicados, não poderão ser usados. Por isso, comande-os com bondade e una-os com disciplina: isso significa sucesso certo. Se as ordens são cumpridas sempre no treino do povo, o povo obedece; se não, não obedece. Ordens cumpridas sempre significam que líder e povo confiam um no outro."}]},{"zh":"地形第十","en":"10. Terrain","pt":"10. O terreno","paras":[{"en":"Master Sun said: Terrain may be open, entangling, stalemated, narrow, steep or distant. Ground both sides can go to and come from is open. On open ground, take the high, sunny places first and protect your supply lines; then you fight with the advantage. Ground you can go into but find hard to come back from is entangling. On entangling ground, if the enemy is unprepared, go out and beat them; if they are prepared and you go out and do not win, it is hard to come back: no advantage. Ground where going out is bad for us and bad for them is stalemated. On stalemated ground, even if the enemy offers us a gain, do not go out; draw back, and when half of them have come out, strike: then you gain. In narrow passes, if you get there first, fill them and wait for the enemy; if the enemy gets there first, do not follow if they have filled the pass, but follow if they have not. On steep ground, if you get there first, take the high, sunny places and wait for the enemy; if the enemy gets there first, draw back and do not follow. On distant ground, with forces equal, it is hard to provoke battle, and fighting is no advantage. These six are the principles of terrain. They are the commander's highest responsibility and must be examined.","pt":"Mestre Sun disse: O terreno pode ser aberto, enredado, de impasse, estreito, íngreme ou distante. O terreno aonde os dois lados podem ir e de onde podem vir é aberto. Em terreno aberto, ocupe primeiro os lugares altos e ensolarados e proteja suas linhas de suprimento; aí você luta com vantagem. O terreno onde se pode entrar, mas de onde é difícil voltar, é enredado. Em terreno enredado, se o inimigo estiver despreparado, saia e vença-o; se estiver preparado e você sair e não vencer, será difícil voltar: não há vantagem. O terreno onde sair é ruim para nós e ruim para eles é de impasse. Em terreno de impasse, mesmo que o inimigo nos ofereça um ganho, não saia; recue, e quando metade deles tiver saído, ataque: aí você tem vantagem. Nas passagens estreitas, se chegar primeiro, ocupe-as por completo e espere o inimigo; se o inimigo chegar primeiro, não o siga se ele ocupou a passagem por completo, mas siga se não ocupou. Em terreno íngreme, se chegar primeiro, ocupe os lugares altos e ensolarados e espere o inimigo; se o inimigo chegar primeiro, recue e não o siga. Em terreno distante, com forças iguais, é difícil provocar a batalha, e lutar não traz vantagem. Esses seis são os princípios do terreno. São a maior responsabilidade do comandante e precisam ser examinados."},{"en":"Armies may flee, slacken, sink, collapse, fall into chaos or be routed. These six are not disasters from heaven but the faults of the commander. With forces equal, sending one against ten is called fleeing. Strong soldiers with weak officers is called slackening. Strong officers with weak soldiers is called sinking. Senior officers angry and insubordinate, fighting on their own out of resentment when they meet the enemy, while the commander does not know their ability, is called collapse. A weak and lax commander, unclear instructions, no fixed duties for officers and men, and troops drawn up any which way is called chaos. A commander who cannot read the enemy, sends few against many and the weak against the strong, and has no picked vanguard, is called rout. These six are the roads to defeat. They are the commander's highest responsibility and must be examined.","pt":"Os exércitos podem fugir, afrouxar, afundar, desmoronar, cair no caos ou ser derrotados em debandada. Esses seis não são desastres vindos do céu, mas defeitos do comandante. Com forças iguais, lançar um contra dez se chama fugir. Soldados fortes com oficiais fracos se chama afrouxar. Oficiais fortes com soldados fracos se chama afundar. Oficiais superiores irritados e insubordinados, que lutam por conta própria por ressentimento ao encontrar o inimigo, enquanto o comandante não conhece sua capacidade, se chama desmoronar. Um comandante fraco e frouxo, instruções pouco claras, nenhuma tarefa fixa para oficiais e soldados, e tropas dispostas de qualquer jeito se chama caos. Um comandante que não consegue entender o inimigo, manda poucos contra muitos e os fracos contra os fortes, e não tem uma vanguarda escolhida, se chama debandada. Esses seis são os caminhos da derrota. São a maior responsabilidade do comandante e precisam ser examinados."},{"en":"Terrain is the army's helper. Reading the enemy to shape victory and weighing obstacles and distances is the way of the great commander. Whoever knows this and fights will surely win; whoever does not know it and fights will surely lose. So if the way of battle means certain victory, fight even if the ruler says not to; if it does not, do not fight even if the ruler says to. The commander who advances without seeking fame and retreats without avoiding blame, whose only concern is to protect the people and serve the ruler's true interest, is the treasure of the state.","pt":"O terreno é o ajudante do exército. Entender o inimigo para construir a vitória e pesar os obstáculos e as distâncias é o caminho do grande comandante. Quem sabe isso e luta certamente vence; quem não sabe e luta certamente perde. Por isso, se o caminho da batalha significa vitória certa, lute mesmo que o governante diga para não lutar; se não significa, não lute mesmo que o governante mande lutar. O comandante que avança sem buscar fama e recua sem fugir da culpa, cuja única preocupação é proteger o povo e servir ao verdadeiro interesse do governante, é o tesouro do Estado."},{"en":"Look on your soldiers as infants and they will go with you into the deepest valleys; look on them as your beloved children and they will die with you. But if you are generous and cannot direct them, loving and cannot command them, and cannot control their disorder, they are like spoiled children and cannot be used.","pt":"Veja seus soldados como bebês e eles irão com você aos vales mais profundos; veja-os como seus filhos amados e eles morrerão com você. Mas se você é generoso e não consegue dirigi-los, amoroso e não consegue comandá-los, e não consegue controlar sua desordem, eles são como crianças mimadas e não podem ser usados."},{"en":"Knowing your troops can attack but not knowing the enemy cannot be attacked is half a victory. Knowing the enemy can be attacked but not knowing your troops cannot attack is half a victory. Knowing the enemy can be attacked and your troops can attack, but not knowing the ground is unfit for battle, is half a victory. So those who know war move without confusion and act without running out of options. So it is said: know the other and know yourself, and victory will not be in danger; know heaven and know earth, and victory can be complete.","pt":"Saber que suas tropas podem atacar, mas não saber que o inimigo não pode ser atacado, é meia vitória. Saber que o inimigo pode ser atacado, mas não saber que suas tropas não podem atacar, é meia vitória. Saber que o inimigo pode ser atacado e que suas tropas podem atacar, mas não saber que o terreno não serve para a batalha, é meia vitória. Por isso, quem conhece a guerra se move sem confusão e age sem ficar sem saída. Por isso se diz: conheça o outro e conheça a si mesmo, e a vitória não correrá perigo; conheça o céu e conheça a terra, e a vitória poderá ser completa."}]},{"zh":"九地第十一","en":"11. The nine grounds","pt":"11. Os nove terrenos","paras":[{"en":"Master Sun said: In war there is scattering ground, light ground, contested ground, crossing ground, crossroads ground, heavy ground, broken ground, enclosed ground and deadly ground. When a lord fights in his own land, it is scattering ground. Entering others' land but not deeply is light ground. Ground that is an advantage to whoever takes it is contested ground. Ground we can go to and they can come to is crossing ground. Ground bordering three states, where whoever arrives first wins the support of the multitude, is crossroads ground. Entering others' land deeply, with many of their cities behind you, is heavy ground. Mountains and forests, gorges and passes, marshes and swamps, all hard roads, are broken ground. Ground entered by a narrow way and left by a winding one, where a few of them can strike many of us, is enclosed ground. Ground where you survive if you fight fast and perish if you do not is deadly ground. So on scattering ground, do not fight. On light ground, do not stop. On contested ground, do not attack. On crossing ground, do not get cut off. On crossroads ground, make alliances. On heavy ground, gather supplies. On broken ground, keep moving. On enclosed ground, use strategy. On deadly ground, fight.","pt":"Mestre Sun disse: Na guerra há o terreno de dispersão, o terreno leve, o terreno disputado, o terreno de passagem, o terreno de encruzilhada, o terreno pesado, o terreno acidentado, o terreno cercado e o terreno mortal. Quando um senhor luta em sua própria terra, é terreno de dispersão. Entrar na terra dos outros, mas não fundo, é terreno leve. O terreno que é vantagem para quem o toma é terreno disputado. O terreno aonde podemos ir e de onde eles podem vir é terreno de passagem. O terreno na fronteira de três Estados, onde quem chega primeiro ganha o apoio da multidão, é terreno de encruzilhada. Entrar fundo na terra dos outros, com muitas cidades deles às costas, é terreno pesado. Montanhas e florestas, desfiladeiros e passagens, pântanos e brejos, todos os caminhos difíceis, são terreno acidentado. O terreno onde se entra por um caminho estreito e se sai por um caminho sinuoso, onde poucos deles podem golpear muitos de nós, é terreno cercado. O terreno onde se sobrevive lutando depressa e se perece não lutando é terreno mortal. Por isso, em terreno de dispersão, não lute. Em terreno leve, não pare. Em terreno disputado, não ataque. Em terreno de passagem, não se deixe isolar. Em terreno de encruzilhada, faça alianças. Em terreno pesado, junte suprimentos. Em terreno acidentado, continue andando. Em terreno cercado, use a estratégia. Em terreno mortal, lute."},{"en":"The skilled commanders of old could keep the enemy's front and rear from reaching each other, large and small units from relying on each other, the high and low from rescuing each other, superiors and subordinates from supporting each other; when the soldiers were scattered they could not regroup, and when assembled they were not in order. They moved when it was to their advantage and stopped when it was not. If asked, 'A large, well-ordered enemy is about to come: how do we meet them?' I say: 'First seize something they love, and they will listen to you.' Speed is the essence of war: take advantage of the enemy not being ready, go by unexpected roads, and attack where they have not taken precautions.","pt":"Os comandantes hábeis de antigamente conseguiam impedir que a frente e a retaguarda do inimigo se alcançassem, que unidades grandes e pequenas contassem umas com as outras, que os de cima e os de baixo se socorressem, que superiores e subordinados se apoiassem; quando os soldados estavam espalhados não conseguiam se reagrupar, e quando reunidos não estavam em ordem. Moviam-se quando era vantajoso e paravam quando não era. Se me perguntam: 'Um inimigo grande e bem ordenado está para chegar: como enfrentá-lo?', digo: 'Primeiro tome algo que ele ama, e ele vai escutar você.' A rapidez é a essência da guerra: aproveite que o inimigo não está pronto, vá por caminhos inesperados e ataque onde ele não tomou precauções."},{"en":"In general, the way of an invading army: the deeper it goes, the more united it is, and the defenders cannot overcome it. Take from rich fields and the whole army has enough to eat. Look after the troops and do not exhaust them; gather their spirit and build up their strength; move the army with plans no one can fathom. Put them where there is nowhere to go and they will die before they flee. If death is unavoidable, officers and soldiers give everything. Soldiers deep in danger lose their fear; with nowhere to go, they stand firm; deep in enemy land, they hold together; with no other choice, they fight. So without being drilled they are alert, without being asked they do what is needed, without being bound they are loyal, without orders they can be trusted. Forbid omens, remove doubts, and they will not turn away until death. Our soldiers have no extra wealth, not because they hate goods; they have no extra years, not because they hate long life. On the day the order comes, those sitting wet their collars with tears, and those lying down have tears running down their cheeks. Put them where there is nowhere to go and they will have the courage of Zhuan Zhu and Cao Gui.","pt":"Em geral, o caminho de um exército invasor: quanto mais fundo vai, mais unido fica, e os defensores não conseguem vencê-lo. Tire dos campos ricos e todo o exército terá o bastante para comer. Cuide das tropas e não as esgote; reúna seu ânimo e acumule sua força; mova o exército com planos que ninguém consegue adivinhar. Coloque-os onde não há para onde ir e eles morrerão antes de fugir. Se a morte é inevitável, oficiais e soldados dão tudo de si. Soldados no fundo do perigo perdem o medo; sem ter para onde ir, ficam firmes; no fundo da terra inimiga, mantêm-se unidos; sem outra escolha, lutam. Assim, sem treino ficam alertas, sem pedido fazem o necessário, sem amarras são leais, sem ordens merecem confiança. Proíba os presságios, afaste as dúvidas, e eles não desistirão até a morte. Nossos soldados não têm riqueza sobrando, não porque detestem os bens; não têm anos sobrando, não porque detestem uma vida longa. No dia em que chega a ordem, os sentados molham a gola de lágrimas, e os deitados têm lágrimas correndo pelo rosto. Coloque-os onde não há para onde ir e terão a coragem de Zhuan Zhu e Cao Gui."},{"en":"Those skilled in war are like the shuairan, the snake of Mount Chang. Strike its head and its tail comes; strike its tail and its head comes; strike its middle and head and tail both come. If asked, 'Can an army be made like the shuairan?' I say: 'It can. The people of Wu and the people of Yue hate each other, yet if they are crossing a river in the same boat and a storm hits, they help each other like left hand and right.' So tethering the horses and burying the wheels is not enough to rely on. To make courage the same in all is the way of governing; to get the best from strong and weak alike is the principle of ground. So those skilled in war lead the army as if leading one person by the hand: they leave it no choice.","pt":"Quem é hábil na guerra é como a shuairan, a cobra do Monte Chang. Golpeie sua cabeça e vem a cauda; golpeie sua cauda e vem a cabeça; golpeie seu meio e vêm cabeça e cauda juntas. Se me perguntam: 'Um exército pode ser como a shuairan?', digo: 'Pode. O povo de Wu e o povo de Yue se odeiam, mas se atravessam um rio no mesmo barco e são pegos por uma tempestade, ajudam-se como a mão esquerda e a direita.' Por isso, amarrar os cavalos e enterrar as rodas não basta para confiar. Tornar a coragem igual em todos é o caminho do governo; tirar o melhor dos fortes e dos fracos é o princípio do terreno. Por isso, os hábeis na guerra conduzem o exército como quem leva uma pessoa pela mão: não lhe deixam escolha."},{"en":"The commander's business is to be calm and inscrutable, upright and orderly. He can keep his officers and soldiers from knowing, so they have no knowledge of his plans; he changes his arrangements and alters his plans so no one recognises them; he moves his camp and takes roundabout routes so no one can anticipate him. When the leader sets them their task, it is like climbing high and removing the ladder; he takes them deep into the lords' lands and releases the trigger; he burns the boats and breaks the cooking pots; he drives them like a flock of sheep, this way and that, and no one knows where they are going. To gather the whole army and throw it into danger: that is the commander's business. The variations of the nine grounds, the advantage of advancing and withdrawing, and the patterns of human nature must be examined.","pt":"O trabalho do comandante é ser calmo e impenetrável, correto e ordenado. Ele consegue manter oficiais e soldados sem saber, de modo que não conhecem seus planos; muda seus arranjos e altera seus planos para que ninguém os reconheça; muda o acampamento e toma caminhos indiretos para que ninguém o antecipe. Quando o líder lhes dá a tarefa, é como subir ao alto e tirar a escada; leva-os fundo na terra dos senhores e solta o gatilho; queima os barcos e quebra as panelas; conduz os soldados como um rebanho de ovelhas, para lá e para cá, e ninguém sabe aonde vão. Reunir todo o exército e lançá-lo ao perigo: esse é o trabalho do comandante. As variações dos nove terrenos, a vantagem de avançar e recuar e os padrões da natureza humana precisam ser examinados."},{"en":"In general, the way of an invader: going deep brings unity, staying shallow brings scattering. Leaving your state and crossing the border to campaign is cut-off ground; ground open on all sides is crossroads ground; going in deep is heavy ground; going in shallow is light ground; strongholds behind and a narrow way ahead is enclosed ground; nowhere to go is deadly ground. So on scattering ground, I would unite their will. On light ground, I would keep them connected. On contested ground, I would hurry up the rear. On crossing ground, I would guard carefully. On crossroads ground, I would strengthen alliances. On heavy ground, I would keep food coming. On broken ground, I would press on along the road. On enclosed ground, I would close the gaps. On deadly ground, I would show them there is no way to survive. For it is the nature of soldiers to resist when surrounded, to fight when there is no choice, and to follow when in extreme danger.","pt":"Em geral, o caminho de um invasor: ir fundo traz união, ficar na superfície traz dispersão. Deixar seu Estado e cruzar a fronteira em campanha é terreno isolado; o terreno aberto para todos os lados é terreno de encruzilhada; entrar fundo é terreno pesado; entrar pouco é terreno leve; fortalezas atrás e caminho estreito à frente é terreno cercado; não ter para onde ir é terreno mortal. Por isso, em terreno de dispersão, eu uniria sua vontade. Em terreno leve, eu os manteria ligados. Em terreno disputado, eu apressaria a retaguarda. Em terreno de passagem, eu vigiaria com cuidado. Em terreno de encruzilhada, eu reforçaria as alianças. Em terreno pesado, eu garantiria a chegada de comida. Em terreno acidentado, eu seguiria em frente pela estrada. Em terreno cercado, eu fecharia as brechas. Em terreno mortal, eu lhes mostraria que não há como sobreviver. Pois é da natureza dos soldados resistir quando cercados, lutar quando não há escolha e seguir as ordens quando em perigo extremo."},{"en":"So whoever does not know the plans of the neighbouring lords cannot make alliances in advance; whoever does not know the shape of mountains and forests, gorges and passes, marshes and swamps cannot march an army; whoever does not use local guides cannot gain the advantage of the ground. Not knowing even one of these is not fitting for the army of a great king. When the army of a great king attacks a large state, the enemy cannot assemble its multitude; when its might falls on the enemy, the enemy's allies cannot join. So it does not compete for alliances everywhere, nor build up power everywhere; it trusts its own resources and brings its might to bear on the enemy, so their cities can be taken and their state overthrown. Give rewards beyond the usual rules, issue orders beyond the usual practice, and you can use the whole army as if it were one person. Give them the task, do not explain it with words; show them the gain, do not tell them the harm. Throw them onto ground of ruin and they will survive; plunge them into deadly ground and they will live. Only when the multitude has fallen into danger can it turn defeat into victory. So the business of war lies in seeming to go along with the enemy's intentions, then concentrating against them in one direction, and killing their commander a thousand li away. This is called accomplishing things through skill.","pt":"Por isso, quem não conhece os planos dos senhores vizinhos não pode fazer alianças com antecedência; quem não conhece a forma das montanhas e florestas, desfiladeiros e passagens, pântanos e brejos não pode fazer marchar um exército; quem não usa guias locais não pode obter a vantagem do terreno. Não saber nem uma dessas coisas não é digno do exército de um grande rei. Quando o exército de um grande rei ataca um Estado grande, o inimigo não consegue reunir sua multidão; quando seu poder cai sobre o inimigo, os aliados do inimigo não conseguem se juntar. Por isso, ele não disputa alianças em toda parte nem acumula poder em toda parte; confia nos próprios recursos e lança seu poder sobre o inimigo, e assim as cidades deles podem ser tomadas e seu Estado derrubado. Dê recompensas além das regras de costume, dê ordens além da prática de costume, e você poderá usar todo o exército como se fosse uma só pessoa. Dê-lhes a tarefa, não a explique com palavras; mostre-lhes o ganho, não lhes conte o dano. Lance-os em terreno de ruína e sobreviverão; mergulhe-os em terreno mortal e viverão. Só quando a multidão cai no perigo consegue transformar a derrota em vitória. Por isso, o trabalho da guerra está em parecer acompanhar as intenções do inimigo, depois concentrar-se contra ele numa só direção e matar seu comandante a mil li de distância. Isso se chama realizar as coisas pela habilidade."},{"en":"So on the day the campaign begins, close the border passes, break the official tallies and let no envoys through. Deliberate sternly in the hall of the temple to settle the plan. When the enemy opens a door, rush in at once. First take what they love, and do not let them know when you will meet. Follow the plan, adjusting to the enemy, to decide the battle. So at first be shy as a young girl, and the enemy will open the door; afterwards be quick as a running hare, and the enemy will be too late to resist.","pt":"Por isso, no dia em que a campanha começa, feche as passagens da fronteira, quebre os salvo-condutos oficiais e não deixe passar enviados. Delibere com rigor no salão do templo para decidir o plano. Quando o inimigo abrir uma porta, entre depressa. Primeiro tome o que ele ama e não o deixe saber quando vocês vão se encontrar. Siga o plano, ajustando-se ao inimigo, para decidir a batalha. Por isso, no começo seja tímido como uma moça, e o inimigo abrirá a porta; depois seja rápido como uma lebre em fuga, e o inimigo chegará tarde demais para resistir."}]},{"zh":"火攻第十二","en":"12. Attack by fire","pt":"12. O ataque com fogo","paras":[{"en":"Master Sun said: There are five kinds of fire attack: burning people, burning stores, burning baggage, burning arsenals and burning supply lines. Using fire requires the right conditions, and the means of making fire must be ready in advance. There are seasons for setting fires and days for starting them. The season is when the weather is dry. The days are when the moon is in the lunar mansions of the Winnowing Basket, the Wall, the Wings or the Chariot Platform: these four are days of rising wind.","pt":"Mestre Sun disse: Há cinco tipos de ataque com fogo: queimar pessoas, queimar estoques, queimar bagagens, queimar arsenais e queimar linhas de suprimento. Usar o fogo exige as condições certas, e os meios de fazer fogo precisam estar prontos com antecedência. Há estações para atear fogo e dias para começá-lo. A estação é quando o tempo está seco. Os dias são quando a lua está nas mansões lunares do Cesto, da Muralha, das Asas ou da Plataforma do Carro: esses quatro são dias de vento forte."},{"en":"In every fire attack, respond to the five changes of fire. When fire starts inside their camp, respond early from outside. When fire starts but their troops stay calm, wait and do not attack; let the fire reach its height, then follow it up if you can, and stop if you cannot. When fire can be started from outside, do not wait for it inside: start it at the right time. When the fire is upwind, do not attack from downwind. Wind that blows by day lasts long; wind at night dies down. Every army must know the five changes of fire and keep watch for the right times. So using fire to aid an attack is intelligent; using water to aid an attack is powerful. Water can cut an enemy off, but cannot take away what they have.","pt":"Em todo ataque com fogo, responda às cinco mudanças do fogo. Quando o fogo começar dentro do acampamento deles, responda cedo, de fora. Quando o fogo começar, mas as tropas deles ficarem calmas, espere e não ataque; deixe o fogo chegar ao auge e então siga adiante se puder, e pare se não puder. Quando o fogo puder ser ateado de fora, não espere que ele comece dentro: ateie-o na
