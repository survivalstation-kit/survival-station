 hora certa. Quando o fogo estiver a favor do vento, não ataque contra o vento. O vento que sopra de dia dura muito; o vento da noite se acalma. Todo exército precisa conhecer as cinco mudanças do fogo e vigiar as horas certas. Por isso, usar o fogo para ajudar um ataque é inteligente; usar a água para ajudar um ataque é poderoso. A água pode isolar o inimigo, mas não pode tirar o que ele tem."},{"en":"To win battles and take what you attack, but not consolidate the results, is a misfortune, called 'wasteful delay'. So it is said: the wise ruler thinks it through and the good commander carries it out. Do not move unless there is gain; do not use troops unless there is something to win; do not fight unless there is danger. A ruler must not raise an army out of anger; a commander must not fight a battle out of resentment. Move when it is to your advantage; stop when it is not. Anger can turn back into joy, resentment back into pleasure, but a state destroyed cannot be restored, and the dead cannot be brought back to life. So the wise ruler is careful and the good commander is cautious. This is the way to keep the state secure and the army whole.","pt":"Vencer batalhas e tomar o que se ataca, mas não consolidar os resultados, é uma desgraça, chamada 'demora desperdiçada'. Por isso se diz: o governante sábio pensa até o fim e o bom comandante executa. Não se mova sem que haja ganho; não use tropas sem que haja algo a conquistar; não lute sem que haja perigo. O governante não deve levantar um exército por raiva; o comandante não deve travar uma batalha por ressentimento. Mova-se quando for vantajoso; pare quando não for. A raiva pode voltar a ser alegria, o ressentimento pode voltar a ser contentamento, mas um Estado destruído não pode ser restaurado, e os mortos não podem voltar à vida. Por isso, o governante sábio é cuidadoso e o bom comandante é prudente. Esse é o caminho para manter o Estado seguro e o exército inteiro."}]},{"zh":"用間第十三","en":"13. Using spies","pt":"13. O uso de espiões","paras":[{"en":"Master Sun said: Raising an army of a hundred thousand and sending it a thousand li costs the people and the state a thousand pieces of gold a day. There is upheaval at home and abroad, people collapse exhausted on the roads, and seven hundred thousand households cannot do their work. Armies may face each other for years to contest a victory decided in a single day. Yet to begrudge ranks, salaries and a hundred pieces of gold and so remain ignorant of the enemy's situation is the height of inhumanity. Such a person is no commander of people, no help to the ruler, no master of victory. What lets the wise ruler and the good commander move, win, and achieve more than ordinary people is knowing in advance. Knowing in advance cannot be had from spirits and gods, cannot be inferred from past events, cannot be checked by calculation. It must come from people who know the enemy's situation.","pt":"Mestre Sun disse: Levantar um exército de cem mil e mandá-lo a mil li custa ao povo e ao Estado mil moedas de ouro por dia. Há agitação dentro e fora do país, pessoas caem exaustas nas estradas, e setecentas mil famílias não conseguem fazer seu trabalho. Exércitos podem se enfrentar por anos para disputar uma vitória decidida num único dia. E mesmo assim poupar postos, salários e cem moedas de ouro e por isso continuar sem conhecer a situação do inimigo é o cúmulo da desumanidade. Essa pessoa não é comandante de gente, não é ajuda para o governante, não é senhora da vitória. O que permite ao governante sábio e ao bom comandante se mover, vencer e realizar mais do que as pessoas comuns é saber de antemão. Saber de antemão não se obtém de espíritos e deuses, não se deduz de acontecimentos passados, não se confirma com cálculos. Tem de vir de pessoas que conhecem a situação do inimigo."},{"en":"There are five kinds of spy: local spies, inside spies, double agents, expendable spies and returning spies. When all five are at work and no one knows how, it is called the divine web, the ruler's treasure. Local spies are people of the area we use. Inside spies are the enemy's officials we use. Double agents are the enemy's spies we turn and use. Expendable spies are given false information openly, let our own spies learn it, and pass it to the enemy. Returning spies come back and report.","pt":"Há cinco tipos de espião: espiões locais, espiões internos, agentes duplos, espiões descartáveis e espiões que retornam. Quando os cinco estão em ação e ninguém sabe como, isso se chama a teia divina, o tesouro do governante. Espiões locais são pessoas da região que usamos. Espiões internos são funcionários do inimigo que usamos. Agentes duplos são espiões do inimigo que convertemos e usamos. Espiões descartáveis recebem informações falsas abertamente, deixam nossos próprios espiões sabê-las e as passam ao inimigo. Espiões que retornam voltam e relatam."},{"en":"So in the whole army, no one is closer to the commander than spies, no rewards are greater than theirs, and no matter is more secret. Without wisdom one cannot use spies; without humanity and justice one cannot employ them; without subtlety one cannot get the truth from them. Subtle! Subtle! There is nothing for which spies are not used. If a spy's matter is heard before it has been carried out, the spy and whoever was told must both die.","pt":"Por isso, em todo o exército, ninguém é mais próximo do comandante do que os espiões, nenhuma recompensa é maior que a deles e nenhum assunto é mais secreto. Sem sabedoria não se pode usar espiões; sem humanidade e justiça não se pode empregá-los; sem sutileza não se pode obter deles a verdade. Sutil! Sutil! Não há nada para que os espiões não sejam usados. Se o assunto de um espião for ouvido antes de ser executado, o espião e quem soube devem ambos morrer."},{"en":"Whenever you want to strike an army, attack a city or kill a person, you must first know the names of the commander in charge, his aides, his attendants, his gatekeepers and his household. Have our spies find them out. Seek out the enemy's spies who come to spy on us, win them with gain, guide them and house them: so double agents can be had and used. Through them we learn, so local and inside spies can be found and employed. Through them we learn, so expendable spies can carry false information to the enemy. Through them we learn, so returning spies can come back as planned. The ruler must know all five, and knowing them depends on the double agent, so the double agent must be treated generously.","pt":"Sempre que quiser golpear um exército, atacar uma cidade ou matar uma pessoa, precisa primeiro saber os nomes do comandante responsável, de seus auxiliares, de seus atendentes, de seus porteiros e de sua casa. Mande nossos espiões descobrirem. Procure os espiões do inimigo que vêm nos espionar, conquiste-os com ganhos, oriente-os e hospede-os: assim se obtêm e se usam agentes duplos. Por meio deles ficamos sabendo, e assim espiões locais e internos podem ser encontrados e empregados. Por meio deles ficamos sabendo, e assim espiões descartáveis podem levar informações falsas ao inimigo. Por meio deles ficamos sabendo, e assim espiões que retornam podem voltar como planejado. O governante precisa conhecer os cinco, e conhecê-los depende do agente duplo, por isso o agente duplo deve ser tratado com generosidade."},{"en":"Long ago, the Yin dynasty rose because Yi Zhi had served the Xia; the Zhou dynasty rose because Lü Ya had served the Yin. So only the wise ruler and the good commander who can use the highest intelligence as spies will achieve great things. This is the essence of war: the whole army relies on it to move.","pt":"Antigamente, a dinastia Yin se ergueu porque Yi Zhi tinha servido aos Xia; a dinastia Zhou se ergueu porque Lü Ya tinha servido aos Yin. Por isso, só o governante sábio e o bom comandante que conseguem usar as inteligências mais elevadas como espiões realizarão grandes coisas. Essa é a essência da guerra: todo o exército depende disso para se mover."}]}];
(() => {
  const $ = id => document.getElementById(id);
  const ui = SURVIVAL.lang === 'pt-BR' ? 'pt' : 'en';
  const L = (en, p) => ui === 'pt' ? p : en;
  let lang = SURVIVAL.store('book-lang') || ui;   // the language of the text (can differ from the menus)
  const VOICE = { en: 'en', pt: 'pt' };

  function render() {
    const T = (en, p) => lang === 'pt' ? p : en;
    document.title = T('The Art of War', 'A Arte da Guerra');
    $('title').textContent = T('The Art of War', 'A Arte da Guerra') + ' · 孫子兵法';
    $('lede').textContent = T('Sun Tzu (Master Sun), China, about 500 BC. Thirteen short chapters on strategy, leadership and conflict, read for 2,500 years well beyond the military.',
                              'Sun Tzu (Mestre Sun), China, por volta de 500 a.C. Treze capítulos curtos sobre estratégia, liderança e conflito, lidos há 2.500 anos muito além do meio militar.');
    $('back').textContent = L('← Books', '← Livros');
    $('lang').textContent = lang === 'pt' ? '🇬🇧 Read in English' : '🇧🇷 Ler em português';
    $('listen-all').textContent = T('🔊 Listen from the start', '🔊 Ouvir do começo');
    $('pause').textContent = T('⏸ Pause', '⏸ Pausar'); $('stop').textContent = T('⏹ Stop', '⏹ Parar');
    $('voice-note').textContent = T('Listening uses this device\'s own voice, with no internet. If it reads in the wrong accent, install the English voice in the device\'s settings.',
                                    'A leitura usa a voz do próprio aparelho, sem internet. Se ler com o sotaque errado, instale a voz em português nas configurações do aparelho.');
    $('about').textContent = T('About this text: a new translation from the original classical Chinese (public domain), made for Survival Station and released into the public domain (CC0): anyone may copy, print, record or share it. Chapter titles are shown in Chinese as in the original.',
                               'Sobre este texto: uma tradução nova, feita a partir do chinês clássico original (domínio público), para o Survival Station, e liberada em domínio público (CC0): qualquer pessoa pode copiar, imprimir, gravar ou compartilhar. Os títulos dos capítulos aparecem também em chinês, como no original.');
    const toc = $('toc'), text = $('text'); toc.replaceChildren(); text.replaceChildren();
    BOOK.forEach((ch, i) => {
      const a = document.createElement('a'); a.href = '#ch' + (i + 1); a.textContent = ch[lang].replace(/^\d+\. /, (i + 1) + '. '); toc.append(a);
      const sec = document.createElement('section'); sec.className = 'card'; sec.id = 'ch' + (i + 1);
      const h = document.createElement('h2'); h.textContent = ch[lang];
      const zh = document.createElement('span'); zh.className = 'muted zh'; zh.textContent = ' ' + ch.zh; h.append(zh);
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn small ghost'; btn.textContent = T('🔊 Listen to this chapter', '🔊 Ouvir este capítulo');
      btn.onclick = () => read(i);
      sec.append(h, btn);
      ch.paras.forEach((p, k) => { const para = document.createElement('p'); para.id = `p${i}-${k}`; para.textContent = p[lang]; sec.append(para); });
      text.append(sec);
    });
  }

  // ---- reading aloud: one paragraph at a time (long texts get cut off in some browsers), highlighted as it goes
  let queue = [], playing = false;
  function voiceFor(l) { return speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith(VOICE[l])); }
  function read(from) {
    if (!('speechSynthesis' in window)) { alert(L('This browser cannot read aloud.', 'Este navegador não consegue ler em voz alta.')); return; }
    stop();
    queue = [];
    for (let i = from; i < BOOK.length; i++) { queue.push({ id: `ch${i + 1}`, text: BOOK[i][lang] }); BOOK[i].paras.forEach((p, k) => queue.push({ id: `p${i}-${k}`, text: p[lang] })); }
    playing = true; $('pause').hidden = false; $('stop').hidden = false; next();
  }
  function next() {
    document.querySelectorAll('.reading').forEach(e => e.classList.remove('reading'));
    if (!playing || !queue.length) return stop();
    const item = queue.shift();
    const el = document.getElementById(item.id); el?.classList.add('reading'); el?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    const u = new SpeechSynthesisUtterance(item.text); u.lang = lang === 'pt' ? 'pt-BR' : 'en-US'; u.rate = 0.95;
    const v = voiceFor(lang); if (v) u.voice = v;
    u.onend = () => { if (playing) next(); };
    speechSynthesis.speak(u);
  }
  function stop() {
    playing = false; try { speechSynthesis.cancel(); } catch { }
    document.querySelectorAll('.reading').forEach(e => e.classList.remove('reading'));
    $('pause').hidden = true; $('stop').hidden = true;
  }
  $('listen-all').onclick = () => read(0);
  $('stop').onclick = stop;
  $('pause').onclick = () => {
    const T = (en, p) => lang === 'pt' ? p : en;
    if (speechSynthesis.paused) { speechSynthesis.resume(); $('pause').textContent = T('⏸ Pause', '⏸ Pausar'); }
    else { speechSynthesis.pause(); $('pause').textContent = T('▶ Continue', '▶ Continuar'); }
  };
  $('lang').onclick = () => { stop(); lang = lang === 'pt' ? 'en' : 'pt'; SURVIVAL.store('book-lang', lang); render(); };
  addEventListener('beforeunload', stop);
  render();
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
})();
</script>
</body>
</html>
