<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplies</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="supplies">
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Survival <span>Station</span></a>
  <nav class="links">
    <a href="index.html" data-i18n="nav.home">Home</a>
    <a href="chat.html" data-i18n="nav.chat">Ask AI</a>
    <a href="map.html" data-i18n="nav.map">Map</a>
    <a href="cards.html" data-cards data-i18n="nav.cards">Emergency</a>
    <a href="search.html" data-i18n="nav.search">Search</a>
    <a href="help.html" data-i18n="nav.help">Help</a>
  </nav>
  <select class="lang-select" aria-label="Language / Idioma"></select>
  <button class="theme-btn" type="button" data-i18n="theme">Theme</button>
</div></header>

<main class="wrap help supplies">
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <div class="status" id="summary"></div>

  <form class="box form no-print" id="add" autocomplete="off">
    <h2 id="add-title"></h2>
    <label><span id="l-name"></span><input id="f-name" required maxlength="80"></label>
    <label><span id="l-cat"></span><select id="f-cat"></select></label>
    <label><span id="l-qty"></span><input id="f-qty" maxlength="30"></label>
    <label><span id="l-exp"></span><input id="f-exp" type="date"></label>
    <label><span id="l-where"></span><input id="f-where" maxlength="60"></label>
    <p class="copy-row"><button class="btn" type="submit" id="add-go"></button> <button class="btn ghost" type="button" id="add-cancel" hidden></button></p>
  </form>

  <p class="copy-row no-print"><button class="btn ghost" type="button" id="print"></button> <span class="muted" id="where"></span></p>
  <table class="supplies-table" id="table"></table>
  <p class="muted" id="empty"></p>
  <h2 id="tips-title"></h2>
  <ul id="tips"></ul>
</main>

<script src="i18n.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const pt = SURVIVAL.lang === 'pt-BR';
  const L = (en, p) => pt ? p : en;
  const $ = id => document.getElementById(id);
  const CATS = { water: L('💧 Water', '💧 Água'), food: L('🥫 Food', '🥫 Comida'), meds: L('💊 Medicine', '💊 Remédio'), firstaid: L('🩹 First aid', '🩹 Primeiros socorros'),
                 power: L('🔋 Batteries and power', '🔋 Pilhas e energia'), baby: L('🍼 Baby', '🍼 Bebê'), pets: L('🐾 Pets', '🐾 Animais'), other: L('📦 Other', '📦 Outros') };
  const SOON = 30, LATER = 90;   // days: "expires soon" and "check in the next months"

  document.title = L('Supplies', 'Estoque');
  $('title').textContent = '📦 ' + L('Supplies and expiry dates', 'Estoque e validades');
  $('lede').textContent = L('Keep track of your stored water, food, medicines and batteries, and see what expires soon. Saved on this device (and on the kit, on the computer running it).',
                            'Controle a água, a comida, os remédios e as pilhas guardados, e veja o que vence logo. Fica salvo neste aparelho (e no kit, no computador que roda o kit).');
  $('add-title').textContent = L('Add an item', 'Adicionar item');
  $('l-name').textContent = L('What', 'O quê'); $('f-name').placeholder = L('e.g. Bottled water 5 L', 'ex.: Água mineral 5 L');
  $('l-cat').textContent = L('Kind', 'Tipo');
  $('l-qty').textContent = L('How many', 'Quantidade'); $('f-qty').placeholder = L('e.g. 6 bottles', 'ex.: 6 garrafas');
  $('l-exp').textContent = L('Expires on (empty if it doesn\'t)', 'Vence em (vazio se não vence)');
  $('l-where').textContent = L('Where it is (optional)', 'Onde está (opcional)'); $('f-where').placeholder = L('e.g. go-bag, garage shelf', 'ex.: mochila, armário da área');
  $('add-cancel').textContent = L('Cancel', 'Cancelar');
  $('print').textContent = L('🖨 Print the list', '🖨 Imprimir a lista'); $('print').onclick = () => print();
  $('f-cat').append(...Object.entries(CATS).map(([k, v]) => new Option(v, k)));
  $('tips-title').textContent = L('Good to know', 'Bom saber');
  for (const t of [
    L('Rotate: use the oldest first ("first in, first out") and replace it with new, so nothing expires in storage.', 'Faça rodízio: use primeiro o mais antigo e reponha com novo, para nada vencer guardado.'),
    L('Check everything twice a year, for example when the clocks change or at the start of the rainy season.', 'Confira tudo duas vezes por ano, por exemplo no começo e no fim do período de chuvas.'),
    L('Stored tap water: replace every 6 months. Sealed bottled water keeps much longer, but follow its date.', 'Água da torneira guardada: troque a cada 6 meses. Água mineral lacrada dura mais, mas siga a validade.'),
    L('Medicines: keep them cool, dry and in their boxes. Expired medicines can lose strength; ask a pharmacist before using any, and never use ones that changed colour or smell.', 'Remédios: guarde em lugar fresco, seco e na caixa. Remédio vencido pode perder o efeito; pergunte a um farmacêutico antes de usar, e nunca use se mudou de cor ou cheiro.'),
    L('Batteries: store at room temperature, out of devices; alkaline batteries keep 5–10 years. Charge power banks every 3 months.', 'Pilhas: guarde em temperatura ambiente, fora dos aparelhos; pilhas alcalinas duram de 5 a 10 anos. Carregue os power banks a cada 3 meses.'),
  ]) { const li = document.createElement('li'); li.textContent = t; $('tips').append(li); }

  let data = (await SURVIVAL.loadData('supplies')) || {};
  data.items = data.items || [];
  let editing = -1;
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const daysLeft = exp => exp ? Math.round((new Date(exp + 'T00:00') - today()) / 86400000) : Infinity;
  const fmt = exp => new Date(exp + 'T00:00').toLocaleDateString(SURVIVAL.lang, { day: 'numeric', month: 'short', year: 'numeric' });

  const save = async () => {
    const onKit = await SURVIVAL.saveData('supplies', data);
    $('where').textContent = onKit ? L('Saved on this device and on the kit.', 'Salvo neste aparelho e no kit.') : L('Saved on this device.', 'Salvo neste aparelho.');
  };

  function render() {
    const rows = data.items.map((it, i) => ({ ...it, i, left: daysLeft(it.exp) })).sort((a, b) => a.left - b.left || a.name.localeCompare(b.name));
    const expired = rows.filter(r => r.left < 0).length, soon = rows.filter(r => r.left >= 0 && r.left <= SOON).length;
    const sum = $('summary'); sum.replaceChildren();
    const pill = (text, cls) => { const s = document.createElement('span'); s.className = 'pill ' + cls; s.textContent = text; sum.append(s); };
    pill(L(`${rows.length} items`, `${rows.length} itens`), '');
    if (expired) pill(L(`⛔ ${expired} expired`, `⛔ ${expired} vencido(s)`), 'bad');
    if (soon) pill(L(`⚠️ ${soon} expire within ${SOON} days`, `⚠️ ${soon} vencem em até ${SOON} dias`), 'warn');
    if (rows.length && !expired && !soon) pill(L('✓ Nothing expires in the next month', '✓ Nada vence no próximo mês'), 'ok');

    const tb = $('table'); tb.replaceChildren();
    $('empty').textContent = rows.length ? '' : L('Nothing yet: add your first item above.', 'Nada ainda: adicione o primeiro item acima.');
    if (!rows.length) return;
    const head = tb.insertRow(); [L('What', 'O quê'), L('Kind', 'Tipo'), L('How many', 'Quantidade'), L('Expires', 'Vence'), L('Where', 'Onde'), ''].forEach(h => { const th = document.createElement('th'); th.textContent = h; head.append(th); });
    for (const r of rows) {
      const tr = tb.insertRow();
      tr.className = r.left < 0 ? 'exp-bad' : r.left <= SOON ? 'exp-soon' : r.left <= LATER ? 'exp-later' : '';
      const when = !r.exp ? L('doesn\'t expire', 'não vence') : `${fmt(r.exp)} · ` + (r.left < 0 ? L(`expired ${-r.left} days ago`, `venceu há ${-r.left} dias`) : r.left === 0 ? L('today', 'hoje') : L(`in ${r.left} days`, `em ${r.left} dias`));
      for (const v of [r.name, CATS[r.cat] || CATS.other, r.qty || '', when, r.where || '']) tr.insertCell().textContent = v;
      const act = tr.insertCell(); act.className = 'no-print';
      const b = (label, fn) => { const x = document.createElement('button'); x.type = 'button'; x.className = 'btn small ghost'; x.textContent = label; x.onclick = fn; act.append(x, ' '); };
      b(L('Edit', 'Editar'), () => { editing = r.i; const it = data.items[r.i]; $('f-name').value = it.name; $('f-cat').value = it.cat; $('f-qty').value = it.qty || ''; $('f-exp').value = it.exp || ''; $('f-where').value = it.where || ''; mode(); $('f-name').focus(); scrollTo({ top: 0, behavior: 'smooth' }); });
      b(L('Delete', 'Apagar'), () => { if (confirm(L(`Delete "${r.name}"?`, `Apagar "${r.name}"?`))) { data.items.splice(r.i, 1); save(); render(); } });
    }
  }
  function mode() { $('add-go').textContent = editing < 0 ? L('➕ Add', '➕ Adicionar') : L('💾 Save', '💾 Salvar'); $('add-cancel').hidden = editing < 0; }
  $('add').onsubmit = e => {
    e.preventDefault();
    const it = { name: $('f-name').value.trim(), cat: $('f-cat').value, qty: $('f-qty').value.trim(), exp: $('f-exp').value, where: $('f-where').value.trim() };
    if (editing < 0) data.items.push(it); else data.items[editing] = it;
    editing = -1; $('add').reset(); mode(); save(); render();
  };
  $('add-cancel').onclick = () => { editing = -1; $('add').reset(); mode(); };
  mode(); render();
})();
</script>
</body>
</html>
