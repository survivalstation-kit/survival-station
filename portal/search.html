<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="search">
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Survival <span>Station</span></a>
  <nav class="links">
    <a href="index.html" data-i18n="nav.home">Home</a>
    <a href="chat.html" data-i18n="nav.chat">Ask AI</a>
    <a href="map.html" data-i18n="nav.map">Map</a>
    <a href="cards.html" data-cards data-i18n="nav.cards">Emergency</a>
    <a href="search.html" aria-current="page" data-i18n="nav.search">Search</a>
    <a href="help.html" data-i18n="nav.help">Help</a>
  </nav>
  <select class="lang-select" aria-label="Language / Idioma"></select>
  <button class="theme-btn" type="button" data-i18n="theme">Theme</button>
</div></header>

<main class="wrap">
  <h1 data-i18n="search.title">Search the whole kit</h1>
  <form class="search-form" action="search.html">
    <input type="search" name="q" id="q" data-i18n-ph="search.ph" autocomplete="off" autofocus>
    <button class="btn" type="submit" data-i18n="search.go">Search</button>
  </form>
  <p class="muted" data-i18n="search.hint"></p>
  <div id="results"></div>
</main>

<script src="i18n.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const { t, dict } = SURVIVAL;
  const results = document.getElementById('results');
  const box = document.getElementById('q');
  const q = (new URLSearchParams(location.search).get('q') || '').trim();
  box.value = q;
  document.title = t('nav.search');
  if (!q) return;
  if (!SURVIVAL.served) { results.append(note(t('search.file'))); return; }

  // accent- and case-insensitive words, so "agua" finds "água"
  const fold = s => s.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  const split = s => s.split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 1);
  // "in quotes" = an exact phrase: those words, in that order, next to each other
  const QUOTE = /["“”„«»]([^"“”„«»]+)["“”„«»]/g;
  const phrases = [...fold(q).matchAll(QUOTE)].map(m => split(m[1])).filter(p => p.length);
  const loose = split(fold(q).replace(QUOTE, ' '));   // the words outside quotes
  const words = [...new Set([...phrases.flat(), ...loose])];
  if (!words.length) return;
  const busyNote = note(t('search.busy'));   // the groups appear one by one; this goes when all are in
  results.after(busyNote);
  // a phrase matches whole words, across spaces, line breaks and punctuation between them
  // (group 1 = the phrase itself; no lookbehind, which older iPhones' Safari can't parse)
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const phraseRes = phrases.map(p => new RegExp('(?:^|[^\\p{L}\\p{N}])(' + p.map(esc).join('[^\\p{L}\\p{N}]+') + ')(?![\\p{L}\\p{N}])', 'gu'));
  const hasPhrases = text => { const f = fold(text); return phraseRes.every(re => { re.lastIndex = 0; return re.test(f); }); };

  // score = how many of the words the text contains; 0 = no match, or a phrase missing
  const score = text => { const f = fold(text); return words.filter(w => f.includes(w)).length; };

  function note(text) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = text; return p; }

  // where the phrases and words are in the text: [start, end] pairs, phrases first
  function spots(f) {
    const hits = [];
    for (const re of phraseRes) {
      re.lastIndex = 0;
      for (const m of f.matchAll(re)) { const s = m.index + m[0].length - m[1].length; hits.push([s, s + m[1].length, 1]); }
    }
    // "de", "of": only inside their phrase, or every "desambiguação" lights up
    for (const w of words.filter(w => w.length > 2)) for (let i = f.indexOf(w); i >= 0; i = f.indexOf(w, i + w.length)) hits.push([i, i + w.length, 0]);
    return hits;
  }

  // text with the search words wrapped in <mark>, built from text nodes (never as HTML)
  function marked(text) {
    const f = fold(text), out = document.createDocumentFragment();
    const hits = spots(f).sort((a, b) => a[0] - b[0] || b[1] - a[1]);   // at the same place, the longer (a phrase) wins
    let at = 0;
    for (const [s, e] of hits) {
      if (s < at) continue;
      out.append(text.slice(at, s));
      const m = document.createElement('mark'); m.textContent = text.slice(s, e); out.append(m);
      at = e;
    }
    out.append(text.slice(at));
    return out;
  }

  // about 200 characters around the spot where the most search words are close together
  // (folding keeps lengths for Latin text)
  function snippet(text) {
    const f = fold(text);
    let i = Infinity, most = 0;
    const phraseAt = spots(f).filter(h => h[2]).map(h => h[0]);
    if (phraseAt.length) i = Math.min(...phraseAt), most = Infinity;   // centre on the exact phrase
    else for (const w of words) for (let at = f.indexOf(w); at >= 0; at = f.indexOf(w, at + w.length)) {
      const near = f.slice(Math.max(0, at - 100), at + 100);
      const n = words.filter(x => near.includes(x)).length;
      if (n > most || (n === most && at < i)) { most = n; i = at; }
    }
    if (!isFinite(i) || text.length <= 200) return text.slice(0, 200);
    const s = Math.max(0, i - 60);
    return (s ? '…' : '') + text.slice(s, s + 200).trim() + '…';
  }

  function group(title, items, more) {
    const sec = document.createElement('section'); sec.className = 'card';
    const h = document.createElement('h2'); h.textContent = title; sec.append(h);
    const ul = document.createElement('ul'); ul.className = 'hits';
    for (const it of items) {
      const li = document.createElement('li');
      const a = document.createElement('a'); a.href = it.href; a.append(marked(it.title));
      if (it.newTab) { a.target = '_blank'; a.rel = 'noopener'; }
      li.append(a);
      if (it.where) { const w = document.createElement('span'); w.className = 'where'; w.textContent = it.where; li.append(w); }
      if (it.text) { const p = document.createElement('div'); p.className = 'snip'; p.append(marked(snippet(it.text))); li.append(p); }
      if (it.extra) li.append(it.extra);
      ul.append(li);
    }
    sec.append(ul);
    if (more) sec.append(more);
    results.append(sec);
  }

  // .check = the text an exact phrase must be in
  const best = (list, n) => list.filter(x => x.score > 0 && (!phrases.length || hasPhrases(x.check || x.title)))
    .sort((a, b) => b.score - a.score).filter((x, _, all) => x.score === all[0].score || x.score >= Math.min(2, words.length))
    .slice(0, n);

  async function page(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    return new DOMParser().parseFromString(await res.text(), 'text/html');
  }

  // 1. the kit's own pages: emergency cards, radio, help (each section on its own)
  const pages = [[dict._cards, t('nav.cards')], ['radio.html', t('tile.radio.t')], ['privacy.html', t('tile.privacy.t')], ['pfa.html', t('tile.pfa.t')], ['help.html', t('nav.help')]];
  const sections = [];
  await Promise.all(pages.map(async ([url, name]) => {
    try {
      const doc = await page(url);
      const scope = doc.querySelector(`article[data-for="${SURVIVAL.lang}"]`) || doc;
      scope.querySelectorAll('th, td, li, p, h3').forEach(e => e.append(' '));   // "Boil" + "Rolling boil" -> two words
      for (const s of scope.querySelectorAll('section[id]')) {
        const h = s.querySelector('h2')?.textContent.trim() || name;
        const text = s.textContent.replace(/\s+/g, ' ').replace(h, '').trim();
        sections.push({ title: h, where: name, href: `${url}#${s.id}`, text, check: h + ' \n ' + text, score: score(h) * 2 + score(text) });
      }
    } catch { }
  }));
  const pageHits = best(sections, 8);
  if (pageHits.length) group(t('search.pages'), pageHits);

  // 2. Survival Data guides: titles and section names from its index page
  try {
    const doc = await page('survival-data/index.html');
    // its sections end up nested (unclosed tags), so take the heading of each link's own section
    const guides = [...doc.querySelectorAll('section a[href]')].map(a => {
      const sec = a.closest('section')?.querySelector(':scope > h2')?.textContent.trim() || '';
      return {
        title: a.textContent.trim(), where: sec, newTab: true,
        href: 'survival-data/' + a.getAttribute('href'), check: a.textContent + ' \n ' + sec,
        score: score(a.textContent) * 2 + score(sec),
      };
    });
    const seen = new Set();   // its index lists some guides twice
    const sdHits = best(guides.filter(g => !seen.has(g.href) && seen.add(g.href)), 10);
    if (sdHits.length) group(t('search.sd'), sdHits);
  } catch { }

  // 2b. inside the Survival Data PDFs: the builder's word index (setup\build-drive.ps1, Build-PdfIndex)
  //     -> the pages with the most search words -> just those pages' text, by Range request
  try {
    const base = 'survival-data/search-index/';
    const docs = await (await fetch(base + 'docs.json')).json();
    const shardKey = w => [...w.slice(0, 2)].map(c => /[a-z0-9]/.test(c) ? c : '_').join('');   // as in the builder
    const shards = {};
    // the word, or (exact = false) longer words starting with it ("purif" finds "purifying")
    const pagesWith = async (w, exact) => {
      const k = shardKey(w);
      shards[k] = shards[k] || fetch(base + 'w/' + k + '.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));
      const shard = await shards[k], found = new Set();
      for (const tok in shard) {
        if (tok !== w && (exact || !(w.length >= 4 && tok.startsWith(w) && tok.length <= w.length + 4))) continue;
        const list = shard[tok];
        for (let i = 0; i < list.length; i += 2) found.add(list[i] * 100000 + list[i + 1]);
      }
      return found;
    };
    // words the builder leaves out of the index (same list as PdfIndexBuilder.Stop, plus anything under 3 letters)
    const STOP = new Set(('the and for are but not you all any can had her was one our out has have this that with from they will would there their what about ' +
      'which when your into than then them these some could other more also only its may been were his him she who how should each such those ' +
      'very most must over same both just where while upon').split(' '));
    const indexed = w => w.length >= 3 && !STOP.has(w);
    const hits = new Map();   // doc*100000+page -> how many search words outside quotes it has
    let most = 0;
    if (phrases.length) {
      // pages with every indexed word of the phrases; the page text is checked for the exact phrase below
      const need = [...new Set(phrases.flat().filter(indexed))];
      if (need.length) {
        const sets = await Promise.all(need.map(w => pagesWith(w, true)));
        const extra = await Promise.all(loose.filter(indexed).map(w => pagesWith(w, false)));
        for (const k of sets.reduce((a, b) => a.size < b.size ? a : b)) {
          if (sets.every(s => s.has(k))) hits.set(k, 1 + extra.filter(s => s.has(k)).length);
        }
      }
    } else {
      const sets = await Promise.all(words.filter(indexed).map(w => pagesWith(w, false)));
      sets.forEach(s => s.forEach(k => hits.set(k, (hits.get(k) || 0) + 1)));
    }
    most = Math.max(0, ...hits.values());
    if (most) {
      // Survival Data keeps some guides in two sections: same title and size = the same PDF, shown once
      const same = new Map(), keep = docs.map((doc, d) => {
        const key = doc.t + '|' + doc.o[doc.o.length - 1];
        if (same.has(key)) return false;
        same.set(key, d); return true;
      });
      const byDoc = new Map();
      for (const [k, n] of hits) if (n === most) {
        const d = Math.floor(k / 100000);
        if (!keep[d]) continue;
        if (!byDoc.has(d)) byDoc.set(d, []);
        byDoc.get(d).push(k % 100000);
      }
      // guides with the search words in their title first, then the ones with the most matching pages
      const ranked = [...byDoc].map(([d, pages]) => ({ d, pages: pages.sort((a, b) => a - b), rank: score(docs[d].t) * 1000 + pages.length }))
        .sort((a, b) => b.rank - a.rank).slice(0, phrases.length ? 25 : 10);
      const items = (await Promise.all(ranked.map(async ({ d, pages }) => {
        const doc = docs[d], pdf = 'survival-data/' + doc.f.split('/').map(encodeURIComponent).join('/');
        // one page's text; a table of contents (dot leaders) matches everything, so prefer a later page
        const pageText = async p => {
          try {
            const res = await fetch(`${base}text/${d}.txt`, { headers: { Range: `bytes=${doc.o[p - 1]}-${doc.o[p] - 1}` } });
            return res.status === 206 ? await res.text() : '';
          } catch { return ''; }
        };
        const contents = s => (s.match(/(\.\s?){6,}/g) || []).length >= 3;
        let page = pages[0], text;
        if (phrases.length) {
          // keep only pages that really have the phrase (the index only knows they have its words)
          const found = [];
          for (const p of pages.slice(0, 8)) {
            const s = await pageText(p);
            if (s && hasPhrases(s)) found.push([p, s]);
          }
          if (!found.length) return null;
          [page, text] = found.find(([, s]) => !contents(s)) || found[0];
          pages = found.map(([p]) => p);
        } else {
          text = await pageText(page);
          for (const p of pages.slice(1, 3)) {
            if (!contents(text)) break;
            const next = await pageText(p);
            if (next) { page = p; text = next; }
          }
        }
        const others = pages.filter(p => p !== page);
        let extra;
        if (others.length) {   // the other pages, as links straight to them
          extra = document.createElement('div'); extra.className = 'pages';
          extra.append(t('search.alsopages') + ' ');
          others.slice(0, 11).forEach(p => {
            const a = document.createElement('a'); a.href = `${pdf}#page=${p}`; a.target = '_blank'; a.rel = 'noopener'; a.textContent = p;
            extra.append(a, ' ');
          });
          if (others.length > 11) extra.append('…');
        }
        return { title: doc.t, where: `${doc.s} · ${t('search.page').replace('{n}', page)}`, href: `${pdf}#page=${page}`, newTab: true, text, extra };
      }))).filter(Boolean).slice(0, 10);
      if (items.length) group(t('search.inpdf'), items);
    }
  } catch { /* no index on this kit yet: Verify / repair builds it */ }

  // 3. your own documents (portal/docs)
  try {
    const files = await (await fetch('docs/index.json', { cache: 'no-store' })).json();
    const docHits = best(files.map(f => ({
      title: f.path, newTab: true, score: score(f.path.replace(/[-_.\/]+/g, ' ')), check: f.path.replace(/[-_.\/]+/g, ' '),
      href: 'docs/' + f.path.split('/').map(encodeURIComponent).join('/'),
    })), 10);
    if (docHits.length) group(t('search.docs'), docHits);
  } catch { }

  // 4. full text of every library book, in the reader's language first (kiwix needs one language per search)
  const langs = [dict._kiwix, ...Object.values(I18N).map(d => d._kiwix).filter(k => k !== dict._kiwix)];
  let libUp = false;
  for (const lang of langs) {
    try {
      // the library ignores quotes, so for a phrase take more results and keep the articles that have it
      const pattern = encodeURIComponent(q.replace(QUOTE, ' $1 ').replace(/\s+/g, ' ').trim());
      const url = `${SURVIVAL.library}/search?format=xml&pageLength=${phrases.length ? 30 : 10}&books.filter.lang=${lang}&pattern=${pattern}`;
      const res = await fetch(url);
      libUp = true;
      if (!res.ok) continue;
      const xml = new DOMParser().parseFromString(await res.text(), 'application/xml');
      const hits = [...xml.querySelectorAll('item')].map(it => {
        const desc = new DOMParser().parseFromString(it.querySelector('description')?.textContent || '', 'text/html');
        return {
          title: it.querySelector('title')?.textContent.trim() || '',
          where: it.querySelector('book > title')?.textContent.trim(),
          text: desc.body.textContent.replace(/^\.+|\.+$/g, '').replace(/\s+/g, ' ').trim(),
          href: SURVIVAL.libHost + it.querySelector('link')?.textContent.trim(), newTab: true,
        };
      // Wikipedia's category pages are only lists of links
      }).filter(h => h.title && !/^(category|categoria):|_categories_partials/i.test(h.title + ' ' + h.href));
      if (phrases.length) {
        const checked = await Promise.all(hits.map(async h => {
          if (hasPhrases(h.title + ' \n ' + h.text)) return h;
          try {   // the phrase may be further into the article than the library's excerpt
            const res = await fetch(h.href);
            const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
            doc.querySelectorAll('script, style').forEach(e => e.remove());
            // a space after each block, or "Bairro" + "Praia de Ipanema" reads as one word
            doc.querySelectorAll('p, li, td, th, div, dd, dt, h1, h2, h3, h4, caption, br').forEach(e => e.append(' '));
            const body = doc.body.textContent.replace(/\s+/g, ' ');
            return hasPhrases(body) ? { ...h, text: body } : null;
          } catch { return null; }
        }));
        hits.splice(0, hits.length, ...checked.filter(Boolean).slice(0, 10));
      }
      if (!hits.length) continue;
      const name = Object.values(I18N).find(d => d._kiwix === lang)?._name || lang;
      const more = document.createElement('p');
      const a = document.createElement('a');
      a.href = `${SURVIVAL.library}/search?books.filter.lang=${lang}&pattern=${pattern}`;
      a.target = '_blank'; a.rel = 'noopener'; a.textContent = t('search.more');
      more.append(a);
      group(`${t('search.lib')} (${name})`, hits, more);
    } catch { }
  }
  busyNote.remove();
  if (!libUp) results.append(note(t('search.libdown')));

  if (!results.children.length) results.append(note(t('search.none')));

  // 5. or ask the AI
  const ask = document.createElement('p');
  const plain = q.replace(QUOTE, '$1');   // the AI doesn't need the search quotes
  const a = document.createElement('a'); a.className = 'btn ghost'; a.href = 'chat.html?q=' + encodeURIComponent(plain);
  a.textContent = t('search.ai').replace('{q}', plain);
  ask.append(a); results.append(ask);
})();
</script>
</body>
</html>
