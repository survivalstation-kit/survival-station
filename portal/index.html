<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival Station</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Survival <span>Station</span></a>
  <nav class="links">
    <a href="index.html" aria-current="page" data-i18n="nav.home">Home</a>
    <a href="chat.html" data-i18n="nav.chat">Ask AI</a>
    <a href="map.html" data-i18n="nav.map">Map</a>
    <a href="cards.html" data-cards data-i18n="nav.cards">Emergency</a>
    <a href="search.html" data-i18n="nav.search">Search</a>
    <a href="help.html" data-i18n="nav.help">Help</a>
  </nav>
  <select class="lang-select" aria-label="Language / Idioma"></select>
  <button class="theme-btn" type="button" data-i18n="theme">Theme</button>
</div></header>

<main class="wrap">
  <h1 data-i18n="home.title">Offline help, no internet needed</h1>
  <p class="lede" data-i18n="home.lede"></p>
  <form class="search-form" action="search.html">
    <input type="search" name="q" data-i18n-ph="home.search.ph" autocomplete="off">
    <button class="btn" type="submit" data-i18n="search.go">Search</button>
  </form>
  <div class="status">
    <span class="pill" id="st-ai" data-i18n="st.ai.checking"></span>
    <span class="pill" id="st-lib" data-i18n="st.lib.checking"></span>
    <span class="pill" id="st-batt" hidden></span>
    <button class="pill power" type="button" id="st-power"></button>
  </div>
  <p class="muted" id="power-note" hidden></p>

  <h2 data-i18n="home.start">Start here</h2>
  <div class="grid">
    <a class="tile primary" href="cards.html" data-cards>
      <div class="ico">⛑️</div><h3 data-i18n="tile.cards.t"></h3><p data-i18n="tile.cards.p"></p>
    </a>
    <a class="tile" id="tile-ai" href="chat.html">
      <div class="ico">💬</div><h3 data-i18n="tile.chat.t"></h3><p data-i18n="tile.chat.p"></p>
    </a>
    <a class="tile" id="tile-lib" href="#" target="_blank" rel="noopener">
      <div class="ico">📚</div><h3 data-i18n="tile.lib.t"></h3><p data-i18n="tile.lib.p"></p>
    </a>
    <a class="tile" id="tile-map" href="map.html">
      <div class="ico">🗺️</div><h3 data-i18n="tile.map.t"></h3><p data-i18n="tile.map.p"></p>
    </a>
    <a class="tile" href="plan.html">
      <div class="ico">👪</div><h3 data-i18n="tile.plan.t"></h3><p data-i18n="tile.plan.p"></p>
    </a>
    <a class="tile" href="print.html">
      <div class="ico">🖨️</div><h3 data-i18n="tile.print.t"></h3><p data-i18n="tile.print.p"></p>
    </a>
    <a class="tile" href="tools.html">
      <div class="ico">🛠️</div><h3 data-i18n="tile.tools.t"></h3><p data-i18n="tile.tools.p"></p>
    </a>
    <a class="tile" href="radio.html">
      <div class="ico">📡</div><h3 data-i18n="tile.radio.t"></h3><p data-i18n="tile.radio.p"></p>
    </a>
    <a class="tile" id="tile-sd" href="survival-data/index.html" target="_blank" rel="noopener">
      <div class="ico">📻</div><h3 data-i18n="tile.sd.t"></h3><p data-i18n="tile.sd.p"></p>
    </a>
    <a class="tile" href="kit.html">
      <div class="ico">🧰</div><h3 data-i18n="tile.kit.t"></h3><p data-i18n="tile.kit.p"></p>
    </a>
    <a class="tile" href="help.html">
      <div class="ico">❓</div><h3 data-i18n="tile.help.t"></h3><p data-i18n="tile.help.p"></p>
    </a>
  </div>

  <h2 data-i18n="home.docs">Your documents</h2>
  <div class="box" id="docs"><p class="muted" data-i18n-html="home.docs.hint"></p></div>

  <h2 data-i18n="home.phone">Use it on a phone</h2>
  <div class="box">
    <div class="qr" id="qr" hidden>
      <div id="qr-code"></div>
      <div><p data-i18n="home.qr"></p><p class="qr-url" id="qr-url"></p><p class="muted" id="qr-more"></p></div>
    </div>
    <ol>
      <li data-i18n-html="home.phone.1"></li>
      <li data-i18n-html="home.phone.2"></li>
      <li data-i18n-html="home.phone.3"></li>
      <li data-i18n-html="home.phone.4"></li>
    </ol>
  </div>

  <footer data-i18n="footer"></footer>
</main>

<script src="i18n.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const { t } = SURVIVAL;
  // the library's home page, filtered to the reader's language
  $('tile-lib').href = `${SURVIVAL.library}/#lang=${SURVIVAL.dict._kiwix}`;

  const [ai, lib] = await Promise.all([SURVIVAL.up(SURVIVAL.ai + '/health'), SURVIVAL.up(SURVIVAL.library + '/')]);
  $('st-ai').textContent = t(ai ? 'st.ai.on' : 'st.ai.off');
  $('st-ai').classList.add(ai ? 'ok' : 'bad');
  $('st-lib').textContent = t(lib ? 'st.lib.on' : 'st.lib.off');
  $('st-lib').classList.add(lib ? 'ok' : 'bad');
  if (!ai) { $('tile-ai').classList.add('off'); $('tile-map').classList.add('off'); }
  if (!lib) $('tile-lib').classList.add('off');

  try {
    const files = await (await fetch('docs/index.json', { cache: 'no-store' })).json();
    if (files.length) {
      const fmt = b => b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.ceil(b / 1e3) + ' KB';
      const ul = document.createElement('ul'); ul.className = 'files';
      for (const f of files) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = 'docs/' + f.path.split('/').map(encodeURIComponent).join('/');
        a.textContent = f.path; a.target = '_blank';
        const s = document.createElement('span'); s.textContent = fmt(f.size);
        li.append(a, s); ul.append(li);
      }
      $('docs').replaceChildren(ul);
    }
  } catch { /* opened as a file, or no index yet: keep the hint */ }

  // Survival-Data is optional (not on every kit): no tile pointing at a missing page
  if (SURVIVAL.served) fetch('survival-data/index.html', { method: 'HEAD' }).then(r => { if (!r.ok) $('tile-sd').hidden = true; }).catch(() => {});

  // low power switch, and the battery where the browser tells it (on the computer itself)
  const power = () => {
    const on = SURVIVAL.lowPower();
    $('st-power').textContent = t(on ? 'power.on' : 'power.off');
    $('st-power').classList.toggle('ok', on);
    $('power-note').textContent = on ? t('power.note') : '';
    $('power-note').hidden = !on;
  };
  $('st-power').onclick = () => { SURVIVAL.setLowPower(!SURVIVAL.lowPower()); power(); };
  power();
  try {
    const b = await navigator.getBattery?.();
    if (b) {
      const show = () => {
        const left = !b.charging && isFinite(b.dischargingTime) ? ` · ${Math.floor(b.dischargingTime / 3600)}h ${String(Math.floor(b.dischargingTime / 60) % 60).padStart(2, '0')}m` : '';
        $('st-batt').textContent = `${b.charging ? '🔌' : '🔋'} ${Math.round(b.level * 100)}%${left}`;
        $('st-batt').classList.toggle('bad', !b.charging && b.level < 0.2);
        // computers with no battery report "plugged in, full": nothing worth showing
        $('st-batt').hidden = b.charging && b.level === 1 && b.chargingTime === 0;
        // on battery and not saving yet: suggest it once
        if (!b.charging && !SURVIVAL.lowPower() && SURVIVAL.store('power-asked') !== '1') { $('power-note').textContent = t('power.suggest'); $('power-note').hidden = false; SURVIVAL.store('power-asked', '1'); }
      };
      b.addEventListener('levelchange', show); b.addEventListener('chargingchange', show); b.addEventListener('dischargingtimechange', show);
      show();
    }
  } catch { }

  // QR code of the kit's address, for phones on the same hotspot or Wi-Fi. On the computer itself the page
  // is on localhost, so the start file writes the network addresses to kit-address.json; on a phone, the
  // address it already uses (so one phone can pass it to the next).
  if (SURVIVAL.served) try {
    let url = location.origin + '/', more = [], a = {};
    try { a = await (await fetch('kit-address.json', { cache: 'no-store' })).json(); } catch { }
    if (/^(localhost|127\.)/.test(location.hostname)) {
      const urls = (a.ips || []).map(ip => `http://${ip}:${a.port || location.port}/`);
      if (!urls.length) throw new Error('no network');
      [url, ...more] = urls;
    }
    // the secure address (Voice extra): what phones need for the microphone
    if (a.https && !SURVIVAL.secure) {
      const host = /^(localhost|127\.)/.test(location.hostname) ? (a.ips || [])[0] : location.hostname;
      if (host) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = t('home.qr.https').replace('{u}', `https://${host}:${a.https}/`); $('qr-more').after(p); }
    }
    await new Promise((ok, fail) => { const s = document.createElement('script'); s.src = 'vendor/qrcode.js'; s.onload = ok; s.onerror = fail; document.head.append(s); });
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    $('qr-code').innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
    $('qr-url').textContent = url;
    if (more.length) $('qr-more').textContent = t('home.qr.more') + ' ' + more.join('  ');
    $('qr').hidden = false;
  } catch { /* no network, or an older kit without the QR library: the steps below still say how */ }
})();
</script>
</body>
</html>
