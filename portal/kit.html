<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My kit</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="kit">
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Survival <span>Station</span></a>
  <nav class="links">
    <a href="index.html" data-i18n="nav.home">Home</a>
    <a href="chat.html" data-i18n="nav.chat">Ask AI</a>
    <a href="map.html" data-i18n="nav.map">Map</a>
    <a href="cards.html" data-cards data-i18n="nav.cards">Emergency</a>
    <a href="search.html" data-i18n="nav.search">Search</a>
    <a href="help.html" data-i18n="nav.help">Help</a>
  </nav>
  <select class="lang-select" aria-label="Language / Idioma"></select>
  <button class="theme-btn" type="button" data-i18n="theme">Theme</button>
</div></header>

<main class="wrap help">
  <h1 id="title">My kit</h1>
  <p class="lede" id="lede"></p>

  <section class="card" id="progress-card" hidden>
    <h2 id="progress-title"></h2>
    <progress id="progress-bar" max="100" value="0"></progress>
    <p class="muted" id="progress-text"></p>
  </section>

  <section class="card" id="selftest">
    <h2 id="test-title"></h2>
    <p id="test-intro"></p>
    <p><button class="btn" type="button" id="test-go"></button></p>
    <table class="checks" id="test-list"></table>
  </section>

  <section class="card" id="private">
    <h2 id="priv-title"></h2>
    <div id="priv-body"></div>
  </section>

  <section class="card" id="manage">
    <h2 id="manage-title"></h2>
    <div id="manage-body"></div>
  </section>

  <section class="card">
    <h2 id="inv-title"></h2>
    <div id="inventory"><p class="muted" id="inv-loading"></p></div>
  </section>
</main>

<script src="i18n.js"></script>
<script src="app.js"></script>
<script>
(() => {
  const pt = SURVIVAL.lang === 'pt-BR';
  const L = (en, p) => pt ? p : en;
  const $ = id => document.getElementById(id);
  const HELPER = 'http://localhost:8091';   // setup\kit-control.ps1, started by START-WINDOWS.bat; this computer only
  const onThisComputer = ['localhost', '127.0.0.1'].includes(location.hostname);
  const size = b => b >= 1e9 ? (b / 1073741824).toFixed(1) + ' GB' : Math.max(1, Math.round(b / 1048576)) + ' MB';
  const time = s => s < 0 ? '?' : s >= 86400 ? `${Math.floor(s / 86400)}d ${Math.floor(s % 86400 / 3600)}h` : s >= 3600 ? `${Math.floor(s / 3600)}h ${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}m` : s >= 60 ? `${Math.floor(s / 60)} min` : '< 1 min';
  const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };

  document.title = L('My kit', 'Meu kit');
  $('title').textContent = L('My kit', 'Meu kit');
  $('lede').textContent = L('What is on this kit, and how to add more or update it.', 'O que tem neste kit e como adicionar mais ou atualizar.');
  $('manage-title').textContent = L('Add more, updates, repair', 'Adicionar, atualizar, reparar');
  $('inv-title').textContent = L('What is on this kit', 'O que tem neste kit');
  $('inv-loading').textContent = L('Checking...', 'Conferindo...');

  // ---- buttons: open the builder window on the computer running the kit
  function showButtons(st) {
    const box = $('manage-body');
    box.replaceChildren();
    const p = el('p', L('These open the builder window on this computer. Adding and updating need internet; repair can also fix files offline.',
                        'Estes botões abrem a janela do construtor neste computador. Adicionar e atualizar precisam de internet; reparar também corrige arquivos sem internet.'));
    const row = el('p', null, 'copy-row');
    const note = el('span', '', 'muted');
    const actions = [
      ['add', L('➕ Add more: books, maps, AI', '➕ Adicionar: livros, mapas, IA')],
      ['updates', L('🔄 Check for updates', '🔄 Procurar atualizações')],
      ['verify', L('🩺 Verify / repair', '🩺 Verificar / reparar')],
    ];
    for (const [action, label] of actions) {
      const b = el('button', label, 'btn'); b.type = 'button';
      b.onclick = async () => {
        note.textContent = L('Opening...', 'Abrindo...');
        try {
          const r = await fetch(`${HELPER}/open?action=${action}`, { method: 'POST' });
          note.textContent = r.ok ? L('The builder window opened on this computer (it may be behind the browser).', 'A janela do construtor abriu neste computador (pode estar atrás do navegador).')
                                  : L('Could not open it.', 'Não deu para abrir.');
        } catch { note.textContent = L('Could not reach the kit helper. Close the kit and start it again.', 'Não deu para falar com o ajudante do kit. Feche o kit e inicie de novo.'); }
      };
      row.append(b);
    }
    row.append(note);
    box.append(p, row);
    if (st.choices) box.append(el('p', L('This kit remembers what it was built with (BUILD-CHOICES.txt), so "Add more" starts with those items ticked.',
                                         'Este kit lembra com o que foi montado (BUILD-CHOICES.txt), então "Adicionar" já começa com esses itens marcados.'), 'muted'));
  }

  function explainNoHelper() {
    const box = $('manage-body');
    box.replaceChildren(el('p', onThisComputer
      ? L('Adding and updating needs a Windows computer with internet: double-click MAKE-USB.bat on the drive. (On a Mac or Linux computer the kit runs, but the builder is Windows only.)',
          'Adicionar e atualizar precisa de um computador Windows com internet: clique duas vezes em MAKE-USB.bat no pendrive. (No Mac ou Linux o kit funciona, mas o construtor é só para Windows.)')
      : L('To add more or update, use the computer running the kit: open this page there (http://localhost:8080/kit.html), or double-click MAKE-USB.bat on the drive. It needs internet.',
          'Para adicionar ou atualizar, use o computador que está rodando o kit: abra esta página nele (http://localhost:8080/kit.html) ou clique duas vezes em MAKE-USB.bat no pendrive. Precisa de internet.')));
  }

  // ---- inventory
  function list(title, items, empty) {
    const wrap = el('div');
    wrap.append(el('h3', title));
    if (!items.length) { wrap.append(el('p', empty, 'muted')); return wrap; }
    const ul = el('ul', null, 'files');
    for (const it of items) { const li = el('li'); li.append(el('span', it.name), el('span', it.size != null ? size(it.size) : '', 'muted')); ul.append(li); }
    wrap.append(ul);
    return wrap;
  }

  function showInventory(st) {
    const inv = $('inventory');
    inv.replaceChildren();
    if (st.root) inv.append(el('p', L(`Kit at ${st.root} - ${size(st.free)} free of ${size(st.size)}`, `Kit em ${st.root} - ${size(st.free)} livres de ${size(st.size)}`), 'muted'));
    inv.append(list(L('AI models', 'Modelos de IA'), st.models, L('None', 'Nenhum')));
    inv.append(list(L('Library books', 'Livros da biblioteca'), st.books, L('None', 'Nenhum')));
    inv.append(list(L('Maps', 'Mapas'), st.maps, L('None yet', 'Nenhum ainda')));
    const extras = [];
    if (st.survivalData != null) extras.push({ name: 'Survival-Data: ' + (st.survivalData ? '✓' : L('not on this kit', 'não está no kit')) });
    if (st.apps != null) extras.push({ name: L('Android apps: ', 'Apps Android: ') + (st.apps ? '✓' : L('not on this kit', 'não estão no kit')) });
    if (extras.length) inv.append(list('Extras', extras, ''));
    if (st.partial && st.partial.length) inv.append(list(L('Unfinished downloads (finish with Verify / repair)', 'Downloads pela metade (termine com Verificar / reparar)'), st.partial, ''));
  }

  function showProgress(p) {
    const card = $('progress-card');
    if (!p) { card.hidden = true; return; }
    card.hidden = false;
    $('progress-bar').value = p.percent;
    if (p.state === 'done') { $('progress-title').textContent = L('✓ Last build finished', '✓ A última montagem terminou'); $('progress-text').textContent = ''; return; }
    if (p.state === 'error') { $('progress-title').textContent = L(`✗ The build stopped at ${p.percent}%`, `✗ A montagem parou em ${p.percent}%`); $('progress-text').textContent = p.item; return; }
    const stale = (Date.now() - new Date(p.updated).getTime()) / 1000 > 90;
    $('progress-title').textContent = stale ? L(`Build paused at ${p.percent}%`, `Montagem parada em ${p.percent}%`)
                                            : L(`Building: ${p.percent}%`, `Montando: ${p.percent}%`);
    $('progress-text').textContent = stale ? L('Its window was closed? Use "Add more" or Verify / repair to continue.', 'A janela foi fechada? Use "Adicionar" ou Verificar / reparar para continuar.')
      : L(`${size(p.done)} of ${size(p.total)} - about ${time(p.secondsLeft)} left - now: ${p.item}`, `${size(p.done)} de ${size(p.total)} - faltam cerca de ${time(p.secondsLeft)} - agora: ${p.item}`);
  }

  // without the helper (phones, Mac/Linux): what the kit's own servers can tell
  async function fallbackInventory() {
    const st = { models: [], books: [], maps: [] };
    try { st.maps = (await (await fetch('maps/index.json', { cache: 'no-store' })).json()).map(m => ({ name: m.file, size: m.size })); } catch {}
    try { const m = await (await fetch(SURVIVAL.ai + '/v1/models')).json(); st.models = (m.data || []).map(x => ({ name: x.id.split(/[\\/]/).pop() + L(' (running now)', ' (rodando agora)') })); } catch {}
    try {
      const xml = new DOMParser().parseFromString(await (await fetch(SURVIVAL.library + '/catalog/v2/entries?count=-1')).text(), 'application/xml');
      st.books = [...xml.querySelectorAll('entry')].map(e => ({ name: e.querySelector('title')?.textContent }));
    } catch {}
    return st;
  }

  // ---- private documents (setup\private-docs.ps1 through the helper): the kit's private\ folder, locked
  $('priv-title').textContent = L('🔒 Private documents', '🔒 Documentos privados');
  let privShown = false;
  function showPrivate(pv) {
    const box = $('priv-body');
    if (!pv) {
      box.replaceChildren(el('p', onThisComputer
        ? L('Put IDs, insurance papers and other personal files in the "private" folder on the kit and lock them with PRIVATE-DOCS.bat (Mac/Linux: bash launch/private-docs.sh). Phones on the hotspot can never see that folder.',
            'Ponha documentos, papéis do seguro e outros arquivos pessoais na pasta "private" do kit e tranque com PRIVATE-DOCS.bat (Mac/Linux: bash launch/private-docs.sh). Celulares no roteador nunca veem essa pasta.')
        : L('Private documents can only be opened on the computer running the kit, with the password. They are never sent to phones.',
            'Documentos privados só abrem no computador que roda o kit, com a senha. Eles nunca são enviados aos celulares.')));
      return;
    }
    const status = el('p');
    const waiting = pv.plain.length ? L(` · ${pv.plain.length} not locked yet: ${pv.plain.join(', ')}`, ` · ${pv.plain.length} ainda sem trancar: ${pv.plain.join(', ')}`) : '';
    status.textContent = L(`${pv.locked} locked file(s)`, `${pv.locked} arquivo(s) trancado(s)`) + waiting + (pv.opened ? L(` · open on this computer (${pv.opened})`, ` · abertos neste computador (${pv.opened})`) : '');
    if (pv.plain.length) status.className = 'warn';
    if (privShown) { box.querySelector('p').replaceWith(status); return; }
    privShown = true;
    const intro = el('p', L('Personal files (IDs, insurance, the family plan) go in the kit\'s "private" folder, which phones on the hotspot can never see. Lock them with a password: write it down somewhere safe, because without it they can\'t be opened. Open them only on a computer you trust; closing deletes the opened copies from it.',
      'Arquivos pessoais (documentos, seguros, o plano da família) ficam na pasta "private" do kit, que os celulares no roteador nunca veem. Tranque com uma senha: anote num lugar seguro, porque sem ela não abrem. Abra só num computador de confiança; fechar apaga as cópias abertas dele.'), 'muted');
    const pw = el('input'); pw.type = 'password'; pw.placeholder = L('Password (6+ characters)', 'Senha (6+ caracteres)'); pw.className = 'pw';
    const msg = el('p', '', 'muted');
    const call = async (path, body) => {
      const r = await fetch(HELPER + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(/wrong password/i.test(j.error) ? L('Wrong password.', 'Senha errada.') : /at least 6/i.test(j.error) ? L('Choose a password of at least 6 characters.', 'Escolha uma senha de pelo menos 6 caracteres.') : j.error);
      return j;
    };
    const btn = (label, fn) => { const b = el('button', label, 'btn ghost'); b.type = 'button'; b.onclick = async () => { msg.textContent = '…'; try { msg.textContent = await fn(); } catch (e) { msg.textContent = e.message; } refresh(); }; return b; };
    const row = el('p', null, 'copy-row');
    row.append(pw,
      btn(L('📁 Show the folder', '📁 Mostrar a pasta'), async () => { await call('/private/show'); return L('The "private" folder opened on this computer.', 'A pasta "private" abriu neste computador.'); }),
      btn(L('🔒 Lock', '🔒 Trancar'), async () => { const j = await call('/private/lock', { password: pw.value }); return L(`Locked ${j.locked} file(s).`, `${j.locked} arquivo(s) trancado(s).`); }),
      btn(L('🔓 Open', '🔓 Abrir'), async () => { await call('/private/open', { password: pw.value }); return L('Opened in a folder on this computer. Choose "Close" when you finish.', 'Abertos numa pasta deste computador. Escolha "Fechar" quando terminar.'); }),
      btn(L('✖ Close', '✖ Fechar'), async () => {
        let j = await call('/private/close', {});
        if (j.unsaved?.length) {
          if (confirm(L(`Changed or new since opening: ${j.unsaved.join(', ')}. Save them back to the kit, locked? (Cancel = delete them)`, `Alterados ou novos desde que abriu: ${j.unsaved.join(', ')}. Salvar de volta no kit, trancados? (Cancelar = apagar)`)))
            await call('/private/close', { password: pw.value, save: true });
          else if (confirm(L('Delete the opened copies without saving?', 'Apagar as cópias abertas sem salvar?'))) await call('/private/close', { discard: true });
          else return L('Left open.', 'Continuam abertos.');
        }
        return L('Closed: the opened copies were deleted from this computer.', 'Fechado: as cópias abertas foram apagadas deste computador.');
      }));
    box.replaceChildren(status, intro, row, msg);
  }

  let buttonsShown = false;
  async function refresh() {
    let st = null;
    if (onThisComputer) { try { const r = await fetch(HELPER + '/status', { cache: 'no-store' }); if (r.ok) st = await r.json(); } catch {} }
    if (st) {
      if (!buttonsShown) { st.canBuild ? showButtons(st) : explainNoHelper(); buttonsShown = true; }
      showInventory(st); showProgress(st.progress); showPrivate(st.private);
    } else if (!buttonsShown) {
      explainNoHelper(); showPrivate(null);
      showInventory(await fallbackInventory());
    }
    return !!st;
  }
  // with the helper, keep the inventory and build progress live
  refresh().then(live => { if (live) setInterval(() => { if (!document.hidden) refresh(); }, 5000); });

  // ---- check the kit: start each part and see that it really answers (any device; some checks only on the computer)
  $('test-title').textContent = L('Check the kit', 'Testar o kit');
  $('test-intro').textContent = L('Tests that each part really starts and answers: worth doing after building or copying a kit, and before you store it. Takes about a minute.',
                                  'Testa se cada parte realmente inicia e responde: vale fazer depois de montar ou copiar um kit, e antes de guardá-lo. Leva cerca de um minuto.');
  $('test-go').textContent = L('▶ Test everything', '▶ Testar tudo');
  const timed = (url, opts = {}, ms = 15000) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return fetch(url, { ...opts, signal: c.signal }).finally(() => clearTimeout(t)); };
  const json = async (url, opts, ms) => { const r = await timed(url, opts, ms); if (!r.ok) throw new Error(r.status); return r.json(); };
  const host = location.hostname;
  // [name, test] - a test returns [true | false | null (not on this kit / not here), detail]
  const CHECKS = [
    [L('Pages', 'Páginas'), async () => [true, 'v' + (window.SURVIVAL_VERSION?.version || '?')]],
    [L('AI answers', 'A IA responde'), async () => {
      const m = await json(SURVIVAL.ai + '/v1/models');
      const t0 = performance.now();
      const r = await json(SURVIVAL.ai + '/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: 'user', content: 'Reply with just: OK' }], max_tokens: 8, chat_template_kwargs: { enable_thinking: false } }) }, 120000);
      const speed = r.timings?.predicted_per_second;
      return [!!r.choices?.[0]?.message, `${(m.data?.[0]?.id || '').split(/[\\/]/).pop()} · ${((performance.now() - t0) / 1000).toFixed(1)} s` + (speed ? ` · ${speed.toFixed(1)} ${L('words/s', 'palavras/s')}` : '')];
    }, L('is the "AI server" window open? Try a smaller model', 'a janela "AI server" está aberta? Tente um modelo menor')],
    [L('Photos (AI looks at pictures)', 'Fotos (a IA olha imagens)'), async () => {
      const p = await json(SURVIVAL.ai + '/props');
      return p.modalities?.vision ? [true, L('this model can look at photos', 'este modelo olha fotos')] : [null, L('this model can\'t: start the kit with the [photos / fotos] model', 'este modelo não olha: inicie o kit com o modelo [photos / fotos]')];
    }],
    [L('Library', 'Biblioteca'), async () => {
      const x = new DOMParser().parseFromString(await (await timed(SURVIVAL.library + '/catalog/v2/entries?count=-1')).text(), 'application/xml');
      const n = x.querySelectorAll('entry').length;
      return [n > 0, L(`${n} books`, `${n} livros`)];
    }, L('is the "Library server" window open? Close the kit and start it again', 'a janela "Library server" está aberta? Feche o kit e inicie de novo')],
    [L('Library search and articles', 'Busca e artigos da biblioteca'), async () => {
      const x = new DOMParser().parseFromString(await (await timed(`${SURVIVAL.library}/search?format=xml&pageLength=3&books.filter.lang=${SURVIVAL.dict._kiwix}&pattern=water%20agua`)).text(), 'application/xml');
      const link = x.querySelector('item > link')?.textContent;
      if (!link) return [false, L('no results for "water"', 'nenhum resultado para "água"')];
      const a = await timed(SURVIVAL.library + link);
      return [a.ok, x.querySelector('item > title')?.textContent];
    }, L('the library server isn\'t running', 'o servidor da biblioteca não está rodando')],
    [L('Map', 'Mapa'), async () => {
      const maps = await json('maps/index.json', { cache: 'no-store' });
      const out = [];
      for (const m of maps) {
        let ok;
        if (m.size >= 2147483648 - 1048576) {   // big maps come from the map server on Windows (see map.html)
          const direct = await timed('maps/' + encodeURIComponent(m.file), { headers: { Range: 'bytes=0-126' } }).then(r => r.status === 206).catch(() => false);
          ok = direct || await timed(`${location.protocol}//${host}:8092/${encodeURIComponent(m.name)}/0/0/0.mvt`).then(r => r.ok).catch(() => false);
        } else ok = await timed('maps/' + encodeURIComponent(m.file), { headers: { Range: 'bytes=0-126' } }).then(r => r.status === 206).catch(() => false);
        out.push((ok ? '✓ ' : '✗ ') + m.name);
        if (!ok && m.size >= 2147483648 - 1048576) out.big = true;
      }
      return [!out.some(s => s.startsWith('✗')), out.join(', ') + (out.big
        ? L(' — maps over 2 GB need the "Map server" window: run Verify / repair, then start the kit again', ' — mapas acima de 2 GB precisam da janela "Map server": rode Verificar / reparar e inicie o kit de novo') : '')];
    }],
    [L('Place search on the map', 'Busca de lugares no mapa'), async () => {
      const r = await timed('maps/places/version.txt', { cache: 'no-store' });
      return r.ok ? [true, L('ready', 'pronta')] : [false, L('missing: run Verify / repair (needs internet)', 'falta: rode Verificar / reparar (precisa de internet)')];
    }],
    ['Survival-Data', async () => {
      const r = await timed('survival-data/index.html');
      if (!r.ok) return [null, L('not on this kit', 'não está no kit')];
      const idx = await timed('survival-data/search-index/docs.json').then(r => r.ok).catch(() => false);
      return [idx, idx ? L('guides and search inside them', 'guias e busca dentro deles') : L('search inside the PDFs missing: run Verify / repair', 'falta a busca dentro dos PDFs: rode Verificar / reparar')];
    }],
    [L('Emergency cards', 'Cartões de emergência'), async () => { const r = await timed(SURVIVAL.dict._cards); return [r.ok, SURVIVAL.dict._cards]; }],
    [L('Read answers aloud', 'Ler respostas em voz alta'), async () => {
      if (!('speechSynthesis' in window)) return [null, L('this browser can\'t', 'este navegador não consegue')];
      let v = speechSynthesis.getVoices();
      if (!v.length) { await new Promise(r => setTimeout(r, 1000)); v = speechSynthesis.getVoices(); }
      const mine = v.filter(x => x.lang.startsWith(SURVIVAL.lang.slice(0, 2)));
      return mine.length ? [true, mine[0].name] : [null, L('no voice for this language on this device: add one in its settings', 'nenhuma voz neste idioma no aparelho: adicione uma nas configurações')];
    }],
    [L('Speak questions (voice)', 'Falar as perguntas (voz)'), async () => {
      if (!onThisComputer) return [null, L('on phones, dictate with the keyboard microphone', 'no celular, dite pelo microfone do teclado')];
      const ok = await timed(`${location.protocol}//${host}:8093/`).then(r => r.ok).catch(() => false);
      return ok ? [true, L('speech server running', 'servidor de voz rodando')] : [null, L('not installed: tick Voice in MAKE-USB.bat', 'não instalada: marque Voz no MAKE-USB.bat')];
    }],
    [L('Phones can connect', 'Celulares conseguem conectar'), async () => {
      if (!onThisComputer) return [true, L('this device is connected', 'este aparelho está conectado')];
      const a = await json('kit-address.json', { cache: 'no-store' }).catch(() => null);
      return a?.ips?.length ? [true, a.ips.map(ip => `http://${ip}:${a.port}/`).join('  ')] : [false, L('no network: turn on a phone hotspot and connect this computer to it', 'sem rede: ligue o roteador de um celular e conecte este computador a ele')];
    }],
  ];
  $('test-go').onclick = async () => {
    const btn = $('test-go'), table = $('test-list');
    btn.disabled = true; table.replaceChildren();
    const rows = CHECKS.map(([name]) => {
      const tr = table.insertRow(); tr.className = 'wait';
      tr.insertCell().textContent = '⏳'; tr.insertCell().textContent = name; tr.insertCell().textContent = '';
      return tr;
    });
    let bad = 0;
    for (let i = 0; i < CHECKS.length; i++) {
      let res;
      try { res = await CHECKS[i][1](); }
      catch (e) {
        res = [false, (e.name === 'AbortError' ? L('no answer (timed out)', 'sem resposta (tempo esgotado)') : L('not answering', 'não responde'))
          + (CHECKS[i][2] ? ': ' + CHECKS[i][2] : '')];
      }
      const [ok, detail] = res;
      rows[i].className = ok === true ? 'ok' : ok === false ? 'bad' : 'na';
      rows[i].cells[0].textContent = ok === true ? '✓' : ok === false ? '✗' : '–';
      rows[i].cells[2].textContent = detail || '';
      if (ok === false) bad++;
    }
    const sum = table.insertRow(); const c = sum.insertCell(); c.colSpan = 3; c.className = bad ? 'bad' : 'ok';
    c.textContent = bad ? L(`${bad} problem(s). Fix them with Verify / repair (MAKE-USB.bat), then test again.`, `${bad} problema(s). Corrija com Verificar / reparar (MAKE-USB.bat) e teste de novo.`)
                        : L('Everything that is on this kit works.', 'Tudo o que está neste kit funciona.');
    btn.disabled = false;
  };
})();
</script>
</body>
