<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="tools">
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Survival <span>Station</span></a>
  <nav class="links">
    <a href="index.html" data-i18n="nav.home">Home</a>
    <a href="chat.html" data-i18n="nav.chat">Ask AI</a>
    <a href="map.html" data-i18n="nav.map">Map</a>
    <a href="cards.html" data-cards data-i18n="nav.cards">Emergency</a>
    <a href="search.html" data-i18n="nav.search">Search</a>
    <a href="help.html" data-i18n="nav.help">Help</a>
  </nav>
  <select class="lang-select" aria-label="Language / Idioma"></select>
  <button class="theme-btn" type="button" data-i18n="theme">Theme</button>
</div></header>

<main class="wrap help tools">
  <h1 data-t="title"></h1>
  <p class="lede" data-t="lede"></p>
  <nav class="toc">
    <a href="#cpr" data-t="cpr.h"></a><a href="#water" data-t="water.h"></a><a href="#supplies" data-t="sup.h"></a>
    <a href="#signal" data-t="sig.h"></a><a href="#morse" data-t="mo.h"></a><a href="#power" data-t="pw.h"></a><a href="#sun" data-t="sun.h"></a>
  </nav>

  <section class="card" id="cpr">
    <h2 data-t="cpr.h"></h2>
    <p data-t="cpr.first"></p>
    <div class="form">
      <label><span data-t="cpr.mode"></span>
        <select id="cpr-mode">
          <option value="30" data-t="cpr.m30"></option>
          <option value="0" data-t="cpr.mhands"></option>
        </select></label>
    </div>
    <div class="cpr">
      <div class="cpr-beat" id="cpr-beat"><span id="cpr-count">–</span></div>
      <div class="cpr-side">
        <button class="btn" type="button" id="cpr-go" data-t="cpr.start"></button>
        <p class="cpr-say" id="cpr-say"></p>
        <p class="muted" id="cpr-time"></p>
      </div>
    </div>
    <ul>
      <li data-t="cpr.how1"></li>
      <li data-t="cpr.how2"></li>
      <li data-t="cpr.how3"></li>
      <li data-t="cpr.how4"></li>
    </ul>
  </section>

  <section class="card" id="water">
    <h2 data-t="water.h"></h2>
    <div class="form">
      <label><span data-t="water.litres"></span> <input type="number" id="w-litres" min="0.1" step="0.5" value="1" inputmode="decimal"></label>
      <label><span data-t="water.product"></span>
        <select id="w-product">
          <option value="br" data-t="water.br"></option>
          <option value="us6" data-t="water.us6"></option>
          <option value="us825" data-t="water.us825"></option>
        </select></label>
      <label class="check"><input type="checkbox" id="w-cloudy"> <span data-t="water.cloudy"></span></label>
    </div>
    <p class="result" id="w-out"></p>
    <ul>
      <li data-t="water.how1"></li>
      <li data-t="water.how2"></li>
      <li data-t="water.how3"></li>
      <li data-t="water.boil"></li>
    </ul>
    <p class="muted" id="w-source"></p>
  </section>

  <section class="card" id="supplies">
    <h2 data-t="sup.h"></h2>
    <div class="form">
      <label><span data-t="sup.adults"></span> <input type="number" id="s-adults" min="0" step="1" value="2" inputmode="numeric"></label>
      <label><span data-t="sup.children"></span> <input type="number" id="s-children" min="0" step="1" value="0" inputmode="numeric"></label>
      <label><span data-t="sup.days"></span> <input type="number" id="s-days" min="1" step="1" value="3" inputmode="numeric"></label>
      <label class="check"><input type="checkbox" id="s-hot"> <span data-t="sup.hot"></span></label>
    </div>
    <div class="result" id="s-out"></div>
    <p class="muted" data-t="sup.note"></p>
  </section>

  <section class="card" id="signal">
    <h2 data-t="sig.h"></h2>
    <p data-t="sig.intro"></p>
    <div class="buttons">
      <button class="btn" type="button" id="b-flash" data-t="sig.flash"></button>
      <button class="btn" type="button" id="b-whistle" data-t="sig.whistle"></button>
      <button class="btn" type="button" id="b-sosbeep" data-t="sig.sosbeep"></button>
    </div>
    <div class="form">
      <label><span data-t="sig.message"></span> <input type="text" id="m-text" maxlength="40" value="SOS"></label>
    </div>
    <div class="buttons">
      <button class="btn ghost" type="button" id="b-mflash" data-t="sig.mflash"></button>
      <button class="btn ghost" type="button" id="b-mbeep" data-t="sig.mbeep"></button>
    </div>
    <p class="muted" id="m-code"></p>
    <p class="muted" data-t="sig.note"></p>
  </section>

  <section class="card" id="morse">
    <h2 data-t="mo.h"></h2>
    <p data-t="mo.intro"></p>
    <h3 data-t="mo.chart"></h3>
    <div class="morse-chart" id="mo-chart"></div>
    <h3 data-t="mo.timing"></h3>
    <ul>
      <li data-t="mo.t1"></li>
      <li data-t="mo.t2"></li>
      <li data-t="mo.t3"></li>
      <li data-t="mo.t4"></li>
    </ul>
    <h3 data-t="mo.send"></h3>
    <ul>
      <li data-t="mo.s1"></li>
      <li data-t="mo.s2"></li>
      <li data-t="mo.s3"></li>
      <li data-t="mo.s4"></li>
      <li data-t="mo.s5"></li>
    </ul>
    <h3 data-t="mo.sig"></h3>
    <table class="morse-sig" id="mo-sig"></table>
    <h3 data-t="mo.read"></h3>
    <ol>
      <li data-t="mo.r1"></li>
      <li data-t="mo.r2"></li>
      <li data-t="mo.r3"></li>
    </ol>
    <h3 data-t="mo.encode"></h3>
    <div class="form">
      <label><span data-t="mo.encode.in"></span> <input type="text" id="mo-txt" maxlength="200" autocomplete="off"></label>
    </div>
    <p class="result morse-code morse-out" id="mo-dots"></p>
    <div class="buttons">
      <button class="btn ghost" type="button" id="mo-copy" data-t="mo.encode.copy"></button>
      <button class="btn ghost" type="button" id="mo-tflash" data-t="sig.mflash"></button>
      <button class="btn ghost" type="button" id="mo-tbeep" data-t="sig.mbeep"></button>
    </div>
    <p class="muted" id="mo-skip"></p>
    <h3 data-t="mo.decode"></h3>
    <div class="form">
      <label><span data-t="mo.decode.in"></span> <input type="text" id="mo-in" maxlength="200" placeholder="... --- ...  /  .... . .-.. .--." autocomplete="off" spellcheck="false"></label>
    </div>
    <p class="result" id="mo-out"></p>
    <h3 data-t="mo.practice"></h3>
    <p data-t="mo.practice.how"></p>
    <div class="buttons">
      <button class="btn" type="button" id="mo-play" data-t="mo.practice.play"></button>
      <button class="btn ghost" type="button" id="mo-again" data-t="mo.practice.again" hidden></button>
      <button class="btn ghost" type="button" id="mo-show" data-t="mo.practice.show" hidden></button>
    </div>
    <p class="result" id="mo-answer"></p>
    <h3 data-t="mo.learn"></h3>
    <ul>
      <li data-t="mo.l1"></li>
      <li data-t="mo.l2"></li>
      <li data-t="mo.l3"></li>
    </ul>
  </section>

  <section class="card" id="power">
    <h2 data-t="pw.h"></h2>
    <p data-t="pw.intro"></p>
    <div class="form">
      <label><span data-t="pw.device"></span>
        <select id="pw-dev">
          <option value="15" data-t="pw.d.phone"></option>
          <option value="25" data-t="pw.d.bigphone"></option>
          <option value="13" data-t="pw.d.radio"></option>
          <option value="4" data-t="pw.d.mesh"></option>
          <option value="3" data-t="pw.d.lamp"></option>
          <option value="35" data-t="pw.d.tablet"></option>
          <option value="0" data-t="pw.d.custom"></option>
        </select></label>
      <label id="pw-custom-l" hidden><span data-t="pw.customwh"></span> <input type="number" id="pw-custom" min="1" step="1" value="20" inputmode="numeric"></label>
      <label><span data-t="pw.bank"></span> <input type="number" id="pw-bank" min="0" step="1000" value="10000" inputmode="numeric"></label>
      <label><span data-t="pw.solar"></span> <input type="number" id="pw-solar" min="0" step="5" value="20" inputmode="numeric"></label>
      <label><span data-t="pw.sunh"></span> <input type="number" id="pw-sunh" min="0" max="12" step="0.5" value="4" inputmode="decimal"></label>
    </div>
    <div class="result" id="pw-out"></div>
    <h3 data-t="pw.laptop"></h3>
    <div class="form">
      <label><span data-t="pw.lapwh"></span> <input type="number" id="pw-lapwh" min="1" step="5" value="50" inputmode="numeric"></label>
      <label><span data-t="pw.lapuse"></span>
        <select id="pw-lapuse">
          <option value="12" data-t="pw.u.light"></option>
          <option value="25" selected data-t="pw.u.mixed"></option>
          <option value="45" data-t="pw.u.heavy"></option>
        </select></label>
    </div>
    <div class="result" id="pw-lap"></div>
    <h3 data-t="pw.tips"></h3>
    <ul>
      <li data-t="pw.t1"></li>
      <li data-t="pw.t2"></li>
      <li data-t="pw.t3"></li>
    </ul>
    <h3 data-t="pw.gen"></h3>
    <ul>
      <li data-t="pw.g1"></li>
      <li data-t="pw.g2"></li>
      <li data-t="pw.g3"></li>
      <li data-t="pw.g4"></li>
    </ul>
    <p class="muted" data-t="pw.note"></p>
  </section>

  <section class="card" id="sun">
    <h2 data-t="sun.h"></h2>
    <div class="form">
      <label><span data-t="sun.lat"></span> <input type="number" id="c-lat" step="any" inputmode="decimal" placeholder="-22.97"></label>
      <label><span data-t="sun.lon"></span> <input type="number" id="c-lon" step="any" inputmode="decimal" placeholder="-43.18"></label>
    </div>
    <p class="muted" id="c-from"></p>
    <div class="buttons">
      <button class="btn ghost" type="button" id="b-gps" data-t="sun.gps" hidden></button>
    </div>
    <div class="result" id="sun-out"></div>
    <h3 data-t="sun.compass"></h3>
    <div class="buttons"><button class="btn ghost" type="button" id="b-compass" data-t="sun.compass.start"></button></div>
    <p class="result" id="compass-out"></p>
    <h3 data-t="sun.find"></h3>
    <ul>
      <li data-t="sun.find1"></li>
      <li data-t="sun.find2"></li>
      <li data-t="sun.find3"></li>
    </ul>
  </section>
</main>

<div class="flash" id="flash" hidden><p data-t="sig.tapstop"></p></div>

<script src="i18n.js"></script>
<script src="app.js"></script>

  async function wake() { try { return await navigator.wakeLock?.request('screen'); } catch { return null; } }
  // play steps [on, units] again and again with light (screen) or sound, until stopped
  function play(steps, unitMs, useLight, button, pauseUnits) {
    if (running) { const was = running.button; running.stop(); if (was === button) return; }
    if (!steps.length) return;
    let alive = true, timer, lock;
    const set = on => { if (useLight) flash.classList.toggle('on', on); else tone(on); };
    if (useLight) { flash.hidden = false; flash.requestFullscreen?.().catch(() => {}); }
    wake().then(l => lock = l);
    const label = button.textContent; button.textContent = tt('sig.stop');
    let i = 0;
    const next = () => {
      if (!alive) return;
      if (i === steps.length) { i = 0; set(false); timer = setTimeout(next, pauseUnits * unitMs); return; }
      const [on, units] = steps[i++]; set(on); timer = setTimeout(next, units * unitMs);
    };
    running = { button, stop() {
      alive = false; clearTimeout(timer); set(false); running = null; button.textContent = label;
      if (useLight) { flash.hidden = true; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
      lock?.release?.();
    } };
    next();
  }
  flash.addEventListener('click', () => running?.stop());
  const SOS = runSteps('...---...');   // the distress signal: one run, no gaps between the letters
  $('b-flash').onclick = e => play(SOS, 250, true, e.currentTarget, 12);
  $('b-sosbeep').onclick = e => play(SOS, 150, false, e.currentTarget, 14);
  // three long blasts, then a pause
  $('b-whistle').onclick = e => play([[true, 6], [false, 2], [true, 6], [false, 2], [true, 6]], 250, false, e.currentTarget, 16);
  const showCode = () => { $('m-code').textContent = $('m-text').value.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').split(/\s+/).map(w => [...w].map(c => MORSE[c] || '').join(' ')).join('  /  '); };
  $('m-text').addEventListener('input', showCode); showCode();
  $('b-mflash').onclick = e => play(morseSteps($('m-text').value), 300, true, e.currentTarget, 14);
  $('b-mbeep').onclick = e => play(morseSteps($('m-text').value), 120, false, e.currentTarget, 14);

  // ------------------------------------------------------------------ Morse code: chart, signals, translator, practice
  const chart = $('mo-chart');
  for (const k of [...'abcdefghijklmnopqrstuvwxyz0123456789', '.', ',', '?', '/']) {
    const d = document.createElement('div');
    const b = document.createElement('b'); b.textContent = k.toUpperCase();
    const c = document.createElement('span'); c.textContent = pretty(MORSE[k]);
    d.append(b, c); chart.append(d);
  }
  const SIGNALS = [['SOS', '...---...', 'mo.sig.sos'], ['K', '-.-', 'mo.sig.k'], ['R', '.-.', 'mo.sig.r'], ['AR', '.-.-.', 'mo.sig.ar'],
                   ['SK', '...-.-', 'mo.sig.sk'], ['?', '..--..', 'mo.sig.q'], ['HH', '........', 'mo.sig.err']];
  for (const [name, code, key] of SIGNALS) {
    const tr = document.createElement('tr');
    const th = document.createElement('th'); th.textContent = name;
    const td1 = document.createElement('td'); td1.className = 'morse-code'; td1.textContent = pretty(code);
    const td2 = document.createElement('td'); td2.textContent = tt(key);
    tr.append(th, td1, td2); $('mo-sig').append(tr);
  }
  // text to dots and dashes: letters separated by a space, words by " / " (accents are dropped: á -> a)
  const plain = s => s.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  const encode = () => {
    const text = plain($('mo-txt').value);
    const skipped = new Set([...text].filter(c => !/\s/.test(c) && !MORSE[c]));
    $('mo-dots').textContent = text.split(/\s+/).filter(Boolean).map(w => [...w].map(c => MORSE[c]).filter(Boolean).map(pretty).join(' ')).filter(Boolean).join('  /  ');
    $('mo-skip').textContent = skipped.size ? tt('mo.encode.skip', { c: [...skipped].join(' ') }) : '';
  };
  $('mo-txt').addEventListener('input', encode);
  $('mo-copy').onclick = async () => {
    // copied with plain . and - so it pastes anywhere (messages, radio apps, the translator below)
    const s = $('mo-dots').textContent.replace(/·/g, '.').replace(/–/g, '-');
    if (!s) return;
    try { await navigator.clipboard.writeText(s); $('mo-copy').textContent = tt('mo.encode.copied'); setTimeout(() => $('mo-copy').textContent = tt('mo.encode.copy'), 2000); }
    catch { getSelection().selectAllChildren($('mo-dots')); }
  };
  $('mo-tflash').onclick = e => play(morseSteps($('mo-txt').value), 300, true, e.currentTarget, 14);
  $('mo-tbeep').onclick = e => play(morseSteps($('mo-txt').value), 120, false, e.currentTarget, 14);

  // dots and dashes to text (also accepts · – _ and the long dash)
  const BACK = Object.fromEntries(Object.entries(MORSE).map(([k, v]) => [v, k.toUpperCase()]));
  const decode = () => {
    const s = $('mo-in').value.replace(/[·•*]/g, '.').replace(/[–—_−]/g, '-').trim();
    const text = !s ? '' : s.split(/\s*[\/|]\s*|\s{3,}/).map(w => w.split(/\s+/).filter(Boolean).map(c => BACK[c] || (c === '...---...' ? 'SOS' : '¿')).join('')).join(' ');
    $('mo-out').textContent = text + (text.includes('¿') ? `   (¿ = ${tt('mo.decode.unknown')})` : '');
  };
  $('mo-in').addEventListener('input', decode);
  // ear practice: a random letter, beeped once at a comfortable speed
  let quiz = '';
  $('mo-play').onclick = () => {
    if (running) running.stop();
    const pool = 'etianmsodrkugwhvflpjbxcyzq';
    quiz = pool[Math.floor(Math.random() * pool.length)];
    $('mo-answer').textContent = ''; $('mo-again').hidden = false; $('mo-show').hidden = false;
    playOnce(morseSteps(quiz));
  };
  // play once (the shared player repeats; stop it after one round)
  function playOnce(steps) {
    let i = 0;
    const next = () => { if (i === steps.length) { tone(false); return; } const [on, units] = steps[i++]; tone(on); setTimeout(next, units * 110); };
    next();
  }
  $('mo-again').onclick = () => quiz && playOnce(morseSteps(quiz));
  $('mo-show').onclick = () => { if (quiz) $('mo-answer').textContent = tt('mo.practice.answer', { l: quiz.toUpperCase(), c: pretty(MORSE[quiz]) }); };

  // ------------------------------------------------------------------ power
  // power bank: mAh at 3.7 V, about 65% reaches the device; solar: about 65% of the label in real use
  function power() {
    const dev = Number($('pw-dev').value) || Math.max(1, num('pw-custom'));
    $('pw-custom-l').hidden = $('pw-dev').value !== '0';
    const mah = num('pw-bank'), bankWh = mah * 3.7 / 1000, useful = bankWh * 0.65;
    const w = num('pw-solar'), h = num('pw-sunh'), solarWh = w * h * 0.65;
    const out = $('pw-out'); out.replaceChildren();
    const line = (b, s) => { const p = document.createElement('p'); const strong = document.createElement('b'); strong.textContent = b; p.append(strong, document.createElement('br'), s); out.append(p); };
    if (mah) line(tt('pw.r.bank', { n: nf(useful / dev, 1) }), tt('pw.r.bankhow', { mah: nf(mah), wh: nf(bankWh) }));
    if (w && h) line(tt('pw.r.solar', { n: nf(solarWh * 0.85 / dev, 1) }), tt('pw.r.solarhow', { w: nf(w), wh: nf(solarWh), h: nf(h, 1), b: bankWh ? nf(solarWh / bankWh, 1) : '–' }) + ' ' + tt('pw.r.cloudy'));
    const hours = num('pw-lapwh') * 0.9 / Number($('pw-lapuse').value);
    $('pw-lap').replaceChildren();
    const p = document.createElement('p'); const strong = document.createElement('b');
    strong.textContent = tt('pw.r.lap', { h: `${Math.floor(hours)}h ${String(Math.round(hours % 1 * 60)).padStart(2, '0')}m` });
    p.append(strong, document.createElement('br'), tt('pw.r.laphow')); $('pw-lap').append(p);
  }
  ['pw-dev', 'pw-custom', 'pw-bank', 'pw-solar', 'pw-sunh', 'pw-lapwh', 'pw-lapuse'].forEach(id => ['input', 'change'].forEach(ev => $(id).addEventListener(ev, power)));
  power();

  // ------------------------------------------------------------------ sun
  // sun position: low-precision formulas from the Astronomical Almanac (about a minute for sunrise times)
  function sunAt(date, lat, lon) {
    const rad = Math.PI / 180, n = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
    const L = (280.460 + 0.9856474 * n) % 360, g = ((357.528 + 0.9856003 * n) % 360) * rad;
    const lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad, eps = (23.439 - 0.0000004 * n) * rad;
    const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)), dec = Math.asin(Math.sin(eps) * Math.sin(lam));
    const gmst = ((18.697374558 + 24.06570982441908 * n) % 24 + 24) % 24;
    const H = (gmst * 15 + lon) * rad - ra, phi = lat * rad;
    const el = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
    const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi)) / rad + 180;
    return { el: el / rad, az: (az + 360) % 360 };
  }
  // sunrise / sunset (sun's top edge with refraction: -0.833°) and the highest point, minute by minute through today
  function sunDay(lat, lon) {
    const day = new Date(); day.setHours(0, 0, 0, 0);
    let rise = null, set = null, noon = null, top = -99, prev = sunAt(day, lat, lon).el;
    for (let m = 1; m <= 1440; m++) {
      const t = new Date(day.getTime() + m * 60000), e = sunAt(t, lat, lon).el;
      if (prev < -0.833 && e >= -0.833) rise = t;
      if (prev >= -0.833 && e < -0.833) set = t;
      if (e > top) { top = e; noon = t; }
      prev = e;
    }
    return { rise, set, noon, top };
  }
  const dir = a => T.dirs[Math.round(a / 45) % 8];
  const hm = d => d ? d.toLocaleTimeString(SURVIVAL.lang, { hour: '2-digit', minute: '2-digit' }) : '–';
  const dur = ms => `${Math.floor(ms / 3600000)}h ${String(Math.floor(ms / 60000) % 60).padStart(2, '0')}m`;
  function sun() {
    const out = $('sun-out'); out.replaceChildren();
    const lat = parseFloat($('c-lat').value), lon = parseFloat($('c-lon').value);
    if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) { $('c-from').textContent = tt('sun.none'); return; }
    const d = sunDay(lat, lon), now = sunAt(new Date(), lat, lon);
    const rows = [];
    if (d.rise || d.set) {
      rows.push([tt('sun.rise'), hm(d.rise)], [tt('sun.set'), hm(d.set)]);
      if (d.rise && d.set && d.set > d.rise) rows.push([tt('sun.daylight'), dur(d.set - d.rise)]);
      if (d.set && new Date() < d.set && (!d.rise || new Date() > d.rise)) rows.push([tt('sun.left'), dur(d.set - new Date())]);
    } else rows.push(['', tt(d.top > 0 ? 'sun.polarday' : 'sun.polarnight')]);
    rows.push([tt('sun.noon'), hm(d.noon)]);
    rows.push([tt('sun.now'), now.el > -0.833 ? tt('sun.up', { a: Math.round(now.az), dir: dir(now.az), e: Math.round(now.el) }) : tt('sun.down')]);
    const table = document.createElement('table');
    for (const [k, v] of rows) { const tr = table.insertRow(); const th = document.createElement('th'); th.textContent = k; tr.append(th); tr.insertCell().textContent = v; }
    const p = document.createElement('p'); p.className = 'muted';
    const noonAz = sunAt(d.noon, lat, lon).az;
    p.textContent = tt(noonAz < 90 || noonAz > 270 ? 'sun.noonnorth' : 'sun.noonsouth') + ' ' + tt('sun.clock');
    out.append(table, p);
  }
  // coordinates: the last point tapped or found on the Map, unless typed here
  try {
    const pt = JSON.parse(SURVIVAL.store('map-point') || 'null');
    if (pt) { $('c-lat').value = pt.lat.toFixed(4); $('c-lon').value = pt.lng.toFixed(4); $('c-from').textContent = tt('sun.from', { p: pt.title || `${pt.lat.toFixed(4)}, ${pt.lng.toFixed(4)}` }); }
  } catch { }
  ['c-lat', 'c-lon'].forEach(id => $(id).addEventListener('input', () => { $('c-from').textContent = ''; sun(); }));
  if (window.isSecureContext && navigator.geolocation) {   // GPS: only on the computer itself (localhost)
    $('b-gps').hidden = false;
    $('b-gps').onclick = () => navigator.geolocation.getCurrentPosition(p => {
      $('c-lat').value = p.coords.latitude.toFixed(4); $('c-lon').value = p.coords.longitude.toFixed(4); $('c-from').textContent = ''; sun();
    }, () => {}, { enableHighAccuracy: true, timeout: 20000 });
  }
  sun();
  setInterval(sun, 60000);

  // ------------------------------------------------------------------ compass
  $('b-compass').onclick = async () => {
    const out = $('compass-out');
    try { if (typeof DeviceOrientationEvent?.requestPermission === 'function') await DeviceOrientationEvent.requestPermission(); } catch { }
    let got = false;
    const show = e => {
      // iPhone: webkitCompassHeading; Android: alpha of the absolute event counts anticlockwise from north
      const h = e.webkitCompassHeading ?? (e.absolute && e.alpha != null ? 360 - e.alpha : null);
      if (h == null) return;
      got = true;
      out.textContent = tt('sun.compass.heading', { a: Math.round(h) % 360, dir: dir(h) });
    };
    window.addEventListener('deviceorientationabsolute', show);
    window.addEventListener('deviceorientation', show);
    setTimeout(() => { if (!got) out.textContent = tt('sun.compass.none'); }, 2500);
  };
})();
</script>
</body>
</html>
